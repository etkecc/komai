repos:
  # Fast built-in hooks (Rust-native, no dependencies)
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '\.clang-format$'
      - id: check-json
        # Visual Studio CMakeSettings uses JSONC comments, which strict JSON parsers reject.
        exclude: '^CMakeSettings\.json$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # Deterministic clang-format toolchain managed by pre-commit (fast, prebuilt).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        name: Format C/C++ sources
        files: '^src/.*\.(cpp|h)$'

  # Local hooks that run project-specific tools
  - repo: local
    hooks:
      - id: check-theme-yaml
        name: Check Theme YAML Validity
        entry: python3 bin/theme/check.py
        language: system
        files: '(resources/themes/.*\.yaml$|bin/theme/)'
        pass_filenames: false
      - id: check-ts-normalized
        name: Check Translation Files Normalized
        entry: python3 bin/check-ts-normalized.py
        language: system
        files: 'resources/langs/.*\.ts$'
        pass_filenames: false
