# Curated server list for Komai's Register page.
#
# Servers with open registration — either in-app UIAA (using_vanilla_reg: true)
# or web-based (using_vanilla_reg: false, with reg_link).
# Seeded from joinmatrix.org probe data (2026-04-10) + demo.etke.host + matrix.org.

servers:
  # --- etke.cc demo ---
  - name: demo.etke.host
    client_domain: matrix.demo.etke.host
    description: "Demo server for testing Matrix, bridges, bots, and other etke.cc services. Not for real use."
    homepage: https://etke.cc/demo/
    using_vanilla_reg: true
    software: Synapse
    languages: [English]
    captcha: false
    email: true
    rank: 10
    category: demo
    editorial: "Test Matrix and [etke.cc](https://etke.cc/?utm_source=komai&utm_medium=app&utm_campaign=register) services (some bridges & bots) on a [demo instance](https://etke.cc/demo/). Accounts may be periodically reset."
    featured: true

  # --- Web-based registration (not UIAA) ---
  - name: matrix.org
    client_domain: matrix-client.matrix.org
    description: "The original Matrix homeserver, operated by the Matrix.org Foundation."
    homepage: https://matrix.org/homeserver/about/
    using_vanilla_reg: false
    software: Synapse
    languages: [English]
    captcha: false
    email: false
    reg_link: https://app.element.io/#/register
    rank: 15
    category: recommended
    editorial: "The flagship Matrix server. Free accounts available, with [paid options](https://matrix.org/homeserver/pricing/) for higher limits. Sometimes overloaded and slow."

