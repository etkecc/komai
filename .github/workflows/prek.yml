name: Prek

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-24.04
    container:
      image: docker.io/alpine:3.23

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base \
            cmake \
            git \
            python3 \
            just \
            bash \
            mise \
            qt6-qtbase-dev \
            qt6-qtdeclarative-dev \
            qt6-qtdeclarative-private-dev \
            qt6-qtmultimedia-dev \
            qt6-qtsvg-dev \
            qt6-qttools-dev \
            coeurl-dev \
            mtxclient-dev \
            olm-dev \
            qtkeychain-dev \
            kdsingleapplication-dev \
            lmdb-dev \
            lmdbxx \
            nlohmann-json \
            spdlog-dev \
            cmark-dev \
            re2-dev \
            openssl-dev \
            curl-dev \
            libevent-dev \
            libsecret-dev \
            yaml-cpp-dev \
            zlib-dev

      - name: Run prek on all files
        run: |
          just configure
          just prek-run-on-all
