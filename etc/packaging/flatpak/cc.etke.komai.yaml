id: cc.etke.komai
command: cc.etke.komai
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
finish-args:
  # needed for webcams, see https://github.com/Nheko-Reborn/nheko/issues/517
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=x11
  - --socket=wayland
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.freedesktop.StatusNotifierItem
  # needed for tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - /libexec
  - /lib/cmake
  - /bin/event_rpcgen.py
  - /bin/playout
  - /bin/secret-tool
  - /bin/gst-*
  - /share/gdb
  - /share/gst*
  - /lib/girepository-1.0/
  - /lib/gst-validate-launcher/
  - /lib/gstreamer-1.0/include
  - /lib/gstreamer-1.0/include/
  - /lib/gstreamer-1.0/libgstcoreelements.so
  - /lib/gstreamer-1.0/libgstopengl*
  - /lib/gstreamer-1.0/libgstximagesink.so
  - /lib/gstreamer-1.0/validate/
  - /lib/libgst*
modules:
  #
  # System dependencies (not managed by CPM — found via find_package/pkg-config)
  # OpenSSL is provided by the KDE Platform runtime.
  #
  - name: gstreamer
    buildsystem: meson
    sources:
      - disable-lfs: true
        disable-submodules: true
        tag: 1.29.1
        type: git
        url: https://gitlab.freedesktop.org/gstreamer/gstreamer.git
    config-opts:
      - --auto-features=disabled
      -  -Dgood=enabled
      -  -Dgst-plugins-good:qt6=enabled
      -  -Dgst-plugins-good:qt-egl=enabled
      -  -Dgst-plugins-good:qt-wayland=enabled
      -  -Dgst-plugins-good:qt-x11=enabled
      -  -Dbase=enabled
      -  -Dgst-plugins-base:gl=enabled
      -  -Dgst-plugins-base:gl_platform=glx,egl
      -  -Dgst-plugins-base:gl_winsys=x11,wayland
      -  -Dgst-plugins-base:x11=enabled
      -  -Dgst-plugins-base:xshm=enabled
  # Komai — CPM-managed deps are pre-fetched as .deps/ source trees below.
  # The Flatpak sandbox has no network access, so FETCHCONTENT_SOURCE_DIR_*
  # tells CPM to use these instead of downloading.
  #
  - name: komai
    builddir: true
    build-options:
      # Rust is installed into the source tree (not /app) so flatpak-builder's
      # global strip pass cannot corrupt rustc's libLLVM shared object.
      append-path: /run/build/komai/.rust/bin
      env:
        CARGO_HOME: /run/build/komai/cargo
        LD_LIBRARY_PATH: /run/build/komai/.rust/lib
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DCOMPILE_QML=ON
      - -DMAN=OFF
      - -DFLATPAK=ON
      # Pre-fetched CPM dependency sources — absolute paths required with builddir: true.
      # /run/build/komai is where flatpak-builder places the komai source tree.
      - -DFETCHCONTENT_SOURCE_DIR_CORROSION=/run/build/komai/.deps/corrosion
      - -DFETCHCONTENT_SOURCE_DIR_QT6KEYCHAIN=/run/build/komai/.deps/qtkeychain
      - -DFETCHCONTENT_SOURCE_DIR_KDSINGLEAPPLICATION=/run/build/komai/.deps/kdsingleapplication
      - -DFETCHCONTENT_SOURCE_DIR_LITEHTML=/run/build/komai/.deps/litehtml
    buildsystem: cmake-ninja
    sources:
      - path: ../../..
        type: dir
        skip:
          - .git
          - var
          - etc/packaging
      # The emoji pipeline fetches Unicode/CLDR inputs into var/emoji/cache on the host.
      # Copy that cache into the sandbox so the build-time generation step stays offline.
      - path: ../../../var/emoji/cache
        dest: var/emoji/cache
        type: dir
      # Pinned Rust toolchain — the SDK's rust-stable extension ships whatever
      # version is current, which may trigger compiler regressions (e.g. the
      # query-depth overflow in matrix-sdk on Rust >=1.94).  Bundle the exact
      # version we test against instead.  Installed into the source tree (not
      # /app) so flatpak-builder's strip pass cannot corrupt the LLVM library.
      - type: archive
        only-arches: [x86_64]
        url: https://static.rust-lang.org/dist/2026-01-22/rust-1.93.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: b9d9f01a96a2542852ccfddd82194276ba1c86bc76353309ff636b737fc0a772
        dest: .rust-installer
      - type: archive
        only-arches: [aarch64]
        url: https://static.rust-lang.org/dist/2026-01-22/rust-1.93.0-aarch64-unknown-linux-gnu.tar.xz
        # TODO: replace with actual sha256 after downloading and verifying
        sha256: FIXME
        dest: .rust-installer
      # Rust crate sources for offline builds (generated by just flatpak-cargo-sources)
      - ../../../var/build/flatpak/cargo-sources.json
      # Pre-fetched CPM dependency sources (no network in sandbox)
      - dest: .deps/corrosion
        disable-lfs: true
        tag: v0.6.1
        type: git
        url: https://github.com/corrosion-rs/corrosion.git
      - type: shell
        commands:
          # Install the pinned Rust toolchain into the source tree.
          - .rust-installer/install.sh --prefix=$PWD/.rust --disable-ldconfig
          - rm -rf .rust-installer
          # Corrosion's `cargo install cxxbridge-cmd --locked` uses the crate's
          # published lockfile, whose pinned versions may differ from our vendor.
          # Drop --locked so cargo resolves from the vendored sources directly.
          - sed -i '/^[[:space:]]*--locked[[:space:]]*$/d' .deps/corrosion/cmake/Corrosion.cmake
      - dest: .deps/qtkeychain
        disable-lfs: true
        tag: 0.15.0
        type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
      - dest: .deps/kdsingleapplication
        disable-lfs: true
        tag: v1.2.0
        type: git
        url: https://github.com/KDAB/KDSingleApplication.git
      - dest: .deps/litehtml
        disable-lfs: true
        tag: v0.9
        type: git
        url: https://github.com/litehtml/litehtml.git
