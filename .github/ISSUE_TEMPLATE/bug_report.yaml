name: Bug report
description: Report a reproducible problem in Komai
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this.
        Please include concrete reproduction steps and environment details so we can triage quickly.

  - type: checkboxes
    id: triage-checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I tested with the latest available Komai build for my install method.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: One short paragraph describing the problem.
      placeholder: Komai freezes for ~5s when switching rooms after login.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Komai with profile `work`
        2. Open room X
        3. Click room Y
        4. Observe freeze
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      placeholder: Room switch should complete immediately.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      placeholder: UI freezes for ~5s, then switches rooms.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Optional but often very helpful for UI/UX bugs.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Komai version
      description: Copy from Settings/About (or from package metadata).
      placeholder: 0.1.0-abcdef0
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Flathub (stable Flatpak)
        - Flatpak nightly or manual Flatpak bundle
        - AppImage
        - Linux distro package (AUR, repo package, etc.)
        - macOS DMG
        - Windows package
        - Local build from source
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - BSD
        - Haiku
        - Other
    validations:
      required: true

  - type: input
    id: de
    attributes:
      label: Desktop environment / window manager
      description: Linux/BSD only.
      placeholder: KDE Plasma (Wayland), GNOME (X11), sway, i3, etc.
    validations:
      required: false

  - type: checkboxes
    id: profile-usage
    attributes:
      label: Profile usage
      description: Komai profile selection uses `-p <profile-id>`.
      options:
        - label: I use a non-default profile (`-p <profile-id>`).
          required: false

  - type: input
    id: qt-version
    attributes:
      label: Qt version (local builds only)
      description: Only fill this if you built Komai yourself.
      placeholder: 6.8.1
    validations:
      required: false

  - type: input
    id: compiler
    attributes:
      label: C++ compiler (local builds only)
      description: Only fill this if you built Komai yourself.
      placeholder: gcc 15.1 / clang 19.1
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant logs. Remove secrets/tokens before posting.
      placeholder: |
        Default log location:
          Linux:   ~/.cache/komai/profiles/<profile-id>/komai.log
          macOS:   ~/Library/Caches/komai/profiles/<profile-id>/komai.log
          Windows: C:/Users/<USER>/AppData/Local/komai/cache/profiles/<profile-id>/komai.log
      render: shell
    validations:
      required: false

  - type: textarea
    id: backtrace
    attributes:
      label: Backtrace (if crash)
      description: A crash backtrace makes fixes much faster.
      placeholder: |
        just configure-debug
        just build
        gdb ./var/build/native/komai
        (gdb) run
        ... reproduce crash ...
        (gdb) bt
      render: shell
    validations:
      required: false
