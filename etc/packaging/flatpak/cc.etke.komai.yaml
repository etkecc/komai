id: cc.etke.komai
command: cc.etke.komai
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
finish-args:
  # needed for webcams, see https://github.com/Nheko-Reborn/nheko/issues/517
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=x11
  - --socket=wayland
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.freedesktop.StatusNotifierItem
  # needed for tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/pkgconfig
  - /bin/mdb*
  - '*.a'
  - /libexec
  - /lib/cmake
  - /bin/cmark
  - /bin/event_rpcgen.py
  - /bin/playout
  - /bin/secret-tool
  - /bin/gst-*
  - /share/gdb
  - /share/gst*
  - /lib/girepository-1.0/
  - /lib/gst-validate-launcher/
  - /lib/gstreamer-1.0/include
  - /lib/gstreamer-1.0/include/
  - /lib/gstreamer-1.0/libgstcoreelements.so
  - /lib/gstreamer-1.0/libgstopengl*
  - /lib/gstreamer-1.0/libgstximagesink.so
  - /lib/gstreamer-1.0/validate/
  - /lib/libgst*
modules:
  #
  # System dependencies (not managed by CPM — found via find_package/pkg-config)
  # fmt, OpenSSL, libcurl are provided by the KDE Platform runtime.
  #
  - name: lmdb
    sources:
      - disable-lfs: true
        tag: LMDB_0.9.35
        type: git
        url: https://git.openldap.org/openldap/openldap.git
    make-install-args:
      - prefix=/app
    no-autogen: true
    subdir: libraries/liblmdb
  - name: libevent
    buildsystem: cmake-ninja
    build-options:
      cflags: -fPIC
      cxxflags: -fPIC
    config-opts:
      - -DEVENT__DISABLE_OPENSSL=ON
      - -DEVENT__DISABLE_BENCHMARK=ON
      - -DEVENT__DISABLE_TESTS=ON
      - -DEVENT__DISABLE_REGRESS=ON
      - -DEVENT__DISABLE_SAMPLES=ON
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - disable-lfs: true
        tag: release-2.1.12-stable
        type: git
        url: https://github.com/libevent/libevent.git
    no-autogen: true
  - name: spdlog
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DSPDLOG_BUILD_BENCH=OFF
      - -DSPDLOG_BUILD_TESTS=OFF
      - -DSPDLOG_BUILD_EXAMPLE=OFF
      - -DSPDLOG_FMT_EXTERNAL=ON
    sources:
      - disable-lfs: true
        tag: v1.17.0
        type: git
        url: https://github.com/gabime/spdlog.git
  - name: re2
    buildsystem: simple
    build-commands:
      - make CXXFLAGS="${CXXFLAGS} -fPIC" static
      - make prefix=/app static-install
    sources:
      - disable-lfs: true
        tag: 2025-11-05
        type: git
        url: https://github.com/google/re2.git
  - name: gstreamer
    buildsystem: meson
    sources:
      - disable-lfs: true
        disable-submodules: true
        tag: 1.26.10
        type: git
        url: https://gitlab.freedesktop.org/gstreamer/gstreamer.git
    config-opts:
      - --auto-features=disabled
      -  -Dgood=enabled
      -  -Dgst-plugins-good:qt6=enabled
      -  -Dgst-plugins-good:qt-egl=enabled
      -  -Dgst-plugins-good:qt-wayland=enabled
      -  -Dgst-plugins-good:qt-x11=enabled
      -  -Dbase=enabled
      -  -Dgst-plugins-base:gl=enabled
      -  -Dgst-plugins-base:gl_platform=glx,egl
      -  -Dgst-plugins-base:gl_winsys=x11,wayland
      -  -Dgst-plugins-base:x11=enabled
      -  -Dgst-plugins-base:xshm=enabled
  # coeurl must be a separate module (not pre-fetched) because mtxclient
  # looks for it via pkg-config, which requires an installed .pc file.
  - name: coeurl
    buildsystem: meson
    config-opts:
      - -Ddefault_library=static
    sources:
      - disable-lfs: true
        tag: v0.3.2
        type: git
        url: https://nheko.im/Nheko-Reborn/coeurl.git
  #
  # Komai — CPM-managed deps are pre-fetched as .deps/ source trees below.
  # The Flatpak sandbox has no network access, so FETCHCONTENT_SOURCE_DIR_*
  # tells CPM to use these instead of downloading.
  #
  - name: komai
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCOMPILE_QML=ON
      - -DMAN=OFF
      - -DFLATPAK=ON
      # Pre-fetched CPM dependency sources — absolute paths required with builddir: true.
      # /run/build/komai is where flatpak-builder places the komai source tree.
      - -DFETCHCONTENT_SOURCE_DIR_COEURL=/run/build/komai/.deps/coeurl
      - -DFETCHCONTENT_SOURCE_DIR_QT6KEYCHAIN=/run/build/komai/.deps/qtkeychain
      - -DFETCHCONTENT_SOURCE_DIR_KDSINGLEAPPLICATION=/run/build/komai/.deps/kdsingleapplication
      - -DFETCHCONTENT_SOURCE_DIR_OLM=/run/build/komai/.deps/olm
      - -DFETCHCONTENT_SOURCE_DIR_CMARK=/run/build/komai/.deps/cmark
      - -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON=/run/build/komai/.deps/nlohmann_json
      - -DFETCHCONTENT_SOURCE_DIR_YAML-CPP=/run/build/komai/.deps/yaml-cpp
      - -DLMDBXX_INCLUDE_DIR=/run/build/komai/.deps/lmdbxx
      - -DFETCHCONTENT_SOURCE_DIR_MATRIXCLIENT=/run/build/komai/.deps/mtxclient
      - -DFETCHCONTENT_SOURCE_DIR_LITEHTML=/run/build/komai/.deps/litehtml
      - -DBLURHASH_SOURCE_DIR=/run/build/komai/.deps/blurhash
      - -DCPP_HTTPLIB_INCLUDE_DIR=/run/build/komai/.deps/cpp-httplib
    buildsystem: cmake-ninja
    sources:
      - path: ../../..
        type: dir
        skip:
          - .git
          - var
          - etc
      # The emoji pipeline fetches Unicode/CLDR inputs into var/emoji/cache on the host.
      # Copy that cache into the sandbox so the build-time generation step stays offline.
      - path: ../../../var/emoji/cache
        dest: var/emoji/cache
        type: dir
      # Pre-fetched CPM dependency sources (no network in sandbox)
      - dest: .deps/coeurl
        disable-lfs: true
        tag: v0.3.2
        type: git
        url: https://nheko.im/Nheko-Reborn/coeurl.git
      - dest: .deps/qtkeychain
        disable-lfs: true
        tag: 0.15.0
        type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
      - dest: .deps/kdsingleapplication
        disable-lfs: true
        tag: v1.2.0
        type: git
        url: https://github.com/KDAB/KDSingleApplication.git
      - dest: .deps/olm
        disable-lfs: true
        disable-shallow-clone: true
        tag: 3.2.16
        type: git
        url: https://gitlab.matrix.org/matrix-org/olm.git
      - type: patch
        path: ../../../cmake/patches/olm/0001-fix-list-const-ptr.patch
        options:
          - --directory=.deps/olm
      - type: patch
        path: ../../../cmake/patches/olm/0002-fix-cmake-cmp0148.patch
        options:
          - --directory=.deps/olm
      - dest: .deps/cmark
        disable-lfs: true
        tag: 0.31.1
        type: git
        url: https://github.com/commonmark/cmark.git
      - dest: .deps/nlohmann_json
        disable-lfs: true
        tag: v3.12.0
        type: git
        url: https://github.com/nlohmann/json.git
      - dest: .deps/yaml-cpp
        type: git
        url: https://github.com/jbeder/yaml-cpp.git
        tag: yaml-cpp-0.9.0
      - dest: .deps/lmdbxx
        disable-lfs: true
        tag: 1.0.0
        type: git
        url: https://github.com/hoytech/lmdbxx.git
      - dest: .deps/mtxclient
        commit: f5766cb53c244a808b7e512c7b83b3942fb67834
        disable-lfs: true
        type: git
        url: https://github.com/Nheko-Reborn/mtxclient.git
      - type: patch
        path: ../../../cmake/patches/mtxclient/0001-add-filename-to-media-messages.patch
        options:
          - --directory=.deps/mtxclient
      - dest: .deps/litehtml
        disable-lfs: true
        tag: v0.9
        type: git
        url: https://github.com/litehtml/litehtml.git
      - dest: .deps/blurhash
        disable-lfs: true
        tag: v0.2.0
        type: git
        url: https://github.com/Nheko-Reborn/blurhash.git
      - dest: .deps/cpp-httplib
        disable-lfs: true
        tag: v0.37.2
        type: git
        url: https://github.com/yhirose/cpp-httplib.git
