name: Packaging check

# Manually-triggered sanity check for the AppImage / Flatpak / Snap / Windows
# build recipes. Linux jobs run on the self-hosted k150 runner; the Windows
# job runs on a GitHub-hosted windows-2025-vs2026 image. Used to iterate on
# each packaging format independently before relying on it from publish.yml,
# and kept long-term for periodic runtime/SDK drift checks (e.g. Flathub
# KDE bumps).

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Which packaging format to build"
        type: choice
        default: all
        options:
          - all
          - appimage
          - flatpak
          - snap
          - macos-arm64
          - windows

permissions:
  contents: read

concurrency:
  group: packaging-check-${{ github.ref }}-${{ inputs.format }}
  cancel-in-progress: true

jobs:
  appimage:
    if: inputs.format == 'all' || inputs.format == 'appimage'
    runs-on: [self-hosted, k150]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build AppImage
        run: just appimage-build-docker

      - name: Upload AppImage artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-appimage
          path: var/build/appimage/*.AppImage
          if-no-files-found: error

  flatpak:
    if: inputs.format == 'all' || inputs.format == 'flatpak'
    runs-on: [self-hosted, k150]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Flatpak
        run: just flatpak-build

      - name: Upload Flatpak artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-flatpak
          path: var/build/flatpak/komai-*.flatpak
          if-no-files-found: error

  snap:
    if: inputs.format == 'all' || inputs.format == 'snap'
    runs-on: [self-hosted, k150]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Snap
        run: just snap-build-docker

      - name: Upload Snap artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-snap
          path: var/build/snap/komai_*.snap
          if-no-files-found: error

  macos-arm64:
    # GitHub-hosted Apple-Silicon runner; explicit pin matches publish.yml.
    # `macos-latest` would auto-bump on GitHub re-aliasing.
    if: inputs.format == 'all' || inputs.format == 'macos-arm64'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build macOS arm64 DMG
        uses: ./.github/actions/build-macos-dmg

  windows:
    # GitHub-hosted runner; explicit pin matches publish.yml.
    if: inputs.format == 'all' || inputs.format == 'windows'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Windows no-installer zip
        uses: ./.github/actions/build-windows-zip
