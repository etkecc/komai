[workspace]
members = [".", "komai-mcp"]

[package]
name = "komai-rust"
# Not published to crates.io — version is irrelevant. The app version is managed in CMakeLists.txt.
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# Parse the UI locale into the BCP-47 language tag Element Call's ClientProperties
# expects. Pinned to the exact version matrix-sdk uses so the `LanguageTag` type
# matches across the boundary (no extra crate is built — it is already in the lock).
language-tags = "0.3.2"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0"
rand = "0.10.*"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "ansi", "env-filter"] }
mime = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
img-parts = "0.4"
bytes = "1"
blurhash = "0.2"
linkify = "0.11"
spellbook = "0.4.0"
unicode-script = "0.5.8"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# ruma is pinned to the same version matrix-rust-sdk uses at this release to avoid
# duplicate-crate type mismatches at the Komai ↔ matrix-sdk boundary.  The
# direct ruma dep only exists to enable the `unstable-msc2545` feature (image
# packs / sticker packs) that matrix-sdk doesn't enable on its own; the
# `markdown` feature comes through matrix-sdk's own `markdown` feature below,
# and `html` is pulled transitively by matrix-sdk-ui.  Code should import ruma
# types through `matrix_sdk::ruma::*` rather than `ruma::*` directly so we
# don't build in a hard coupling to the direct ruma version.
ruma = { version = "0.16.0", features = ["unstable-msc2545"] }
# `experimental-widgets` provides the native Matrix Widget API driver
# (`matrix_sdk::widget`) that powers Element Call: capability negotiation, event
# relay, encrypted to-device, OpenID and MSC4157 delayed events, plus the EC
# widget URL builder. It is always compiled (it has no QtWebEngine dependency);
# only the C++/QML side is gated behind the ELEMENT_CALL CMake option.
matrix-sdk = { version = "0.18.0", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "bundled-sqlite", "markdown", "experimental-widgets"] }
matrix-sdk-base = "0.18.0"
matrix-sdk-ui = "0.18.0"

# TLS backend: rustls with aws-lc-rs as the crypto provider, matching what
# matrix-sdk now hard-wires. Previously we forced native-tls (OpenSSL) to avoid
# a second TLS stack and a Flatpak issue with aws-lc-sys' Jitterentropy C code
# requiring `-O0`. matrix-sdk dropped native-tls in 2026-04, and aws-lc-sys
# 0.39+ now filters `-O*` CFLAGS for the Jitterentropy compile unit on its own
# (see its `jitter_entropy_cflags_guard`), so we can safely unify on rustls.
resolvematrix = { path = "resolvematrix", default-features = false, features = ["server"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "multipart"] }
sha2 = "0.11"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[build-dependencies]
cxx-build = "1"

[profile.release]
incremental = true
strip = true
