  rules:
    - if: '$CI_PIPELINE_TRIGGERED == null'
  artifacts:
    paths:
      - 'artifacts/komai-latest-x86_64.AppImage'
    expire_in: 1 week
    expose_as: 'appimage-amd64'
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .ccache

linting:
  stage: build
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:latest
  tags: [docker]
  before_script:
    - apk update && apk add make git python3 py3-pip qt6-qtdeclarative-dev
    # clang18 seems to mess with the emit keyword when using the `->` operator
    - apk add clang-extra-tools --repository=http://dl-cdn.alpinelinux.org/alpine/edge/main
    - export PATH="$PATH:/usr/lib/llvm/bin/:/root/.local/bin"
    - pip3 install --break-system-packages --user reuse
  script:
    - make lint
    - make license
  rules:
    - if : '$CI_PIPELINE_TRIGGERED == null'

github-release:
  stage: deploy
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:latest
  tags: [docker]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  dependencies:
    #- appimage-amd64 <- disabled because of missing packages
    - build-flatpak
    - codesign-macos-intel
    - codesign-macos-as
    - codesign-windows
  before_script:
    - apk update && apk add jq curl perl
  script:
    - ./.ci/update-github-release.sh
