# Sample profile state.yml (runtime/volatile UI state)

meta:
  settings_schema_version: 1

ui:
  window:
    width_px: 1600
    height_px: 900

sidebars:
  room_list:
    width_px: 320
    current_room_id: ""
  communities:
    width_px: 220
    filtering:
      current: ""
      global_excludes: []
      badges_hidden:
        - global
        - "tag:m.lowpriority"
      collapsed_spaces: []

timeline:
  pins:
    hidden: []
  widgets:
    hidden: []

composer:
  drafts:
    by_room: {}
