build-macos:
  stage: build
  tags: [macos]
  before_script:
    - rm -rf ../.hunter &&  mv .hunter ../.hunter || true
  script:
    - ./.ci/macos/build.sh
  after_script:
    - mv ../.hunter .hunter
  rules:
    - if : '$CI_PIPELINE_TRIGGERED == null'
  artifacts:
    paths:
      - komai.app # not putting this in 'artifacts' subdir because we don't want to put it on releases
    name: komai-${CI_COMMIT_SHORT_SHA}-macos-app
    expose_as: 'macos-app'
    public: false
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .hunter/
      - "${CCACHE_DIR}"

build-macos-as:
  extends: build-macos
  image: registry.nheko.im/nheko-reborn/nheko/cirruslabs/macos-sequoia-xcode:16.2
  variables:
    TART_REGISTRY_HOSTNAME: $CI_REGISTRY
    TART_REGISTRY_USERNAME: $CI_REGISTRY_USER
    TART_REGISTRY_PASSWORD: $CI_JOB_TOKEN
  tags: [macos-tart]
  before_script:
    - brew install python3 pkg-config clang-format cmake ninja openssl gstreamer pipx
    - pipx install aqtinstall
    - pipx ensurepath
    - . ~/.zshrc
    - mkdir $HOME/Qt
    - aqt install-qt --outputdir $HOME/qt mac desktop 6.8 clang_64 -m qtlocation qtimageformats qtmultimedia qtpositioning qtshadertools
  script:
    - export QTPATH=($HOME/qt/6.*/macos/bin)
    - export PATH="$QTPATH:${PATH}"
    - ./.ci/macos/build.sh

.codesign-macos: &codesign_macos
  stage: sign
  before_script:
    - pipx install dmgbuild
    - pipx ensurepath
  tags: [macos]
  script:
    - export QTPATH=(/Users/jdonof/Qt/6.*/macos/bin)
    - export PATH=${QTPATH}:${PATH}
    - ./.ci/macos/notarize.sh
  after_script:
    - ./.ci/upload-nightly-gitlab.sh artifacts/komai-${CI_COMMIT_SHORT_SHA}-${PLAT}.dmg
  artifacts:
    paths:
      - artifacts/komai-${CI_COMMIT_SHORT_SHA}-${PLAT}.dmg
    name: komai-${CI_COMMIT_SHORT_SHA}-macos

codesign-macos-intel:
  <<: *codesign_macos
  variables:
    PLAT: "intel"
  needs:
    - job: build-macos
  rules:
    - if : '$CI_COMMIT_BRANCH == "master"'
    - if : $CI_COMMIT_TAG

codesign-macos-as:
  <<: *codesign_macos
  tags: [macos]
  variables:
    PLAT: "apple_silicon"
  needs:
    - job: build-macos-as
      optional: true # optional since we want to be able to also trigger this job from cirrus ci for apple silicon builds.
  rules:
    - if : '$CI_PIPELINE_TRIGGERED && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        PLAT: "apple_silicon"
    - if : '$CI_COMMIT_BRANCH == "master"'
    - if : $CI_COMMIT_TAG

build-flatpak:
  stage: build
  image:
    # need flatpak builder 1.4.4
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/ubuntu:rolling
    #docker:
    #  platform: ${ARCH}
  #image: 'registry.gitlab.gnome.org/gnome/gnome-runtime-images/gnome:master'
  tags:
    - docker-amd64
  parallel:
    matrix:
      - ARCH: amd64
        AARCH: x86_64
        JOBS: 0
      - ARCH: arm64
        AARCH: aarch64
        JOBS: 3
  before_script:
    - apt-get update && apt-get -y install flatpak-builder git python3 curl python3-aiohttp python3-tenacity gir1.2-ostree-1.0
    - flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      # see https://github.com/flatpak/flatpak-builder/issues/495
    - git config --global protocol.file.allow always
  script:
    - export VERSION=$(git describe)
    # workaround for https://github.com/flatpak/flatpak/issues/5076
    - dbus-send --system /org/freedesktop/DBus org.freedesktop.DBus || (mkdir -p /run/dbus/ && dbus-daemon --system --fork)
    - mkdir -p var/build/flatpak
    - cd var/build/flatpak
    - flatpak-builder --arch=${AARCH} --install-deps-from=flathub --user --disable-rofiles-fuse --ccache --repo=repo --default-branch=${CI_COMMIT_REF_NAME//\//_} --subject="Build of Komai ${VERSION} `date` for ${ARCH}" app ../../../etc/packaging/flatpak/cc.etke.komai.yaml --jobs=$JOBS
    - flatpak install --user -y flathub org.flatpak.Builder
    - flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream app/files/share/app-info/xmls/cc.etke.komai.xml.gz
    - flatpak --arch=${AARCH} build-bundle repo komai-${ARCH}.flatpak cc.etke.komai ${CI_COMMIT_REF_NAME//\//_}
  after_script:
    - bash ./.ci/upload-nightly-gitlab.sh var/build/flatpak/komai-${ARCH}.flatpak
    - (cd ./scripts && ./upload-to-flatpak-repo.sh ../var/build/flatpak/repo) || exit_code=$?
  rules:
    - if : '$CI_PIPELINE_TRIGGERED == null'
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - var/build/flatpak/.flatpak-builder/
    when: always # because the arm runner is slow and ooms often otherwise!
  artifacts:
    expose_as: 'flatpak'
    paths: ['var/build/flatpak/komai-${ARCH}.flatpak']
    name: flatpak-${CI_COMMIT_REF_NAME}-${VERSION}-${ARCH}


