  # and prints the actual hash on mismatch); then commit the lock change.
  version: "0.26.0"
  url: "https://registry.npmjs.org/@element-hq/element-call-embedded/-/element-call-embedded-{version}.tgz"
  sha256: "91094b72ee8e5d8b935b89add1cb0edf57bffd27de4481c1a4a41fbddd9d2303"
