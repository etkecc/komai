id: cc.etke.komai
command: cc.etke.komai
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
finish-args:
  # needed for webcams, see https://github.com/Nheko-Reborn/nheko/issues/517
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=x11
  - --socket=wayland
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.freedesktop.StatusNotifierItem
  # needed for tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/pkgconfig
  - /bin/mdb*
  - '*.a'
  - /libexec
  - /lib/cmake
  - /bin/cmark
  - /bin/event_rpcgen.py
  - /bin/playout
  - /bin/secret-tool
  - /bin/gst-*
  - /share/gdb
  - /share/gst*
  - /lib/girepository-1.0/
  - /lib/gst-validate-launcher/
  - /lib/gstreamer-1.0/include
  - /lib/gstreamer-1.0/include/
  - /lib/gstreamer-1.0/libgstcoreelements.so
  - /lib/gstreamer-1.0/libgstopengl*
  - /lib/gstreamer-1.0/libgstximagesink.so
  - /lib/gstreamer-1.0/validate/
  - /lib/libgst*
modules:
  - name: lmdb
    sources:
      - sha256: 0d090c6a7c85a4f31a2ab0d734554c21097f24752393a190b0e51996b08f48c4
        type: archive
        url: https://git.openldap.org/openldap/openldap/-/archive/LMDB_0.9.35/openldap-LMDB_0.9.35.tar.gz
    make-install-args:
      - prefix=/app
    no-autogen: true
    subdir: libraries/liblmdb
  - name: libevent
    buildsystem: autotools
    config-opts:
      - --disable-shared
      - --prefix=/app
      - --disable-openssl
    sources:
      - sha256: 92e6de1be9ec176428fd2367677e61ceffc2ee1cb119035037a27d346b0403bb
        type: archive
        url: https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz
    make-install-args:
      - prefix=/app
    no-autogen: true
  - name: cmark
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMARK_TESTS=OFF
      - -DBUILD_TESTING=OFF
      - -DBUILD_SHARED_LIBS=OFF
    sources:
      - sha256: f9bc5ca38bcb0b727f0056100fac4d743e768872e3bacec7746de28f5700d697
        type: archive
        url: https://github.com/commonmark/cmark/archive/0.31.2.tar.gz
  - name: fmt
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DFMT_DOC=OFF
      - -DFMT_TEST=OFF
    sources:
      - sha256: 203eb4e8aa0d746c62d8f903df58e0419e3751591bb53ff971096eaa0ebd4ec3
        type: archive
        url: https://github.com/fmtlib/fmt/releases/download/11.2.0/fmt-11.2.0.zip
  - name: spdlog
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSPDLOG_BUILD_BENCH=OFF
      - -DSPDLOG_BUILD_TESTING=OFF
      - -DSPDLOG_BUILD_EXAMPLE=OFF
      - -DSPDLOG_FMT_EXTERNAL=ON
    sources:
      - sha256: 15a04e69c222eb6c01094b5c7ff8a249b36bb22788d72519646fb85feb267e67
        type: archive
        url: https://github.com/gabime/spdlog/archive/v1.15.3.tar.gz
  - name: olm
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    buildsystem: cmake-ninja
    sources:
      - commit: 7e0c8277032e40308987257b711b38af8d77cc69
        disable-shallow-clone: true
        tag: 3.2.16
        type: git
        url: https://gitlab.matrix.org/matrix-org/olm.git
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
    sources:
      - commit: 0936f740c02b60f02657729cd99f581db4517a41
        tag: 0.21.7
        type: git
        url: https://gitlab.gnome.org/GNOME/libsecret.git
  - name: QtKeychain
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TEST_APPLICATION=OFF
      - -DBUILD_SHARED_LIBS=OFF
    buildsystem: cmake-ninja
    sources:
      - commit: ad7344c45a86a4f66cbafc4b081b5f7b876cb0b7
        tag: 0.15.0
        type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
  - name: nlohmann
    config-opts:
      - -DJSON_BuildTests=OFF
    buildsystem: cmake-ninja
    sources:
      - sha256: 4b92eb0c06d10683f7447ce9406cb97cd4b453be18d7279320f7b2f025c10187
        type: archive
        url: https://github.com/nlohmann/json/archive/v3.12.0.tar.gz
  - name: kdsingleapplication
    config-opts:
      - -DKDSingleApplication_EXAMPLES=OFF
      - -DKDSingleApplication_QT6=ON
    buildsystem: cmake-ninja
    sources:
      - sha256: ff4ae6a4620beed1cdb3e6a9b78a17d7d1dae7139c3d4746d4856b7547d42c38
        type: archive
        url: https://github.com/KDAB/KDSingleApplication/releases/download/v1.2.0/kdsingleapplication-1.2.0.tar.gz
  - name: abseil-cpp
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/abseil/abseil-cpp/releases/download/20250127.1/abseil-cpp-20250127.1.tar.gz
        sha256: b396401fd29e2e679cace77867481d388c807671dc2acc602a0259eeb79b7811
  - name: re2
    buildsystem: simple
    build-commands:
      - make static
      - make prefix=/app static-install
    sources:
      - sha256: 87f6029d2f6de8aa023654240a03ada90e876ce9a4676e258dd01ea4c26ffd67
        type: archive
        url: https://github.com/google/re2/releases/download/2025-11-05/re2-2025-11-05.tar.gz
  - name: gstreamer
    buildsystem: meson
    sources:
      - commit: bfdc62185e243d3633aa916187a566d03a587792
        tag: 1.26.10
        type: git
        url: https://gitlab.freedesktop.org/gstreamer/gstreamer.git
        disable-submodules: true
    config-opts:
      - --auto-features=disabled
      -  -Dgood=enabled
      -  -Dgst-plugins-good:qt6=enabled
      -  -Dgst-plugins-good:qt-egl=enabled
      -  -Dgst-plugins-good:qt-wayland=enabled
      -  -Dgst-plugins-good:qt-x11=enabled
      -  -Dbase=enabled
      -  -Dgst-plugins-base:gl=enabled
      -  -Dgst-plugins-base:gl_platform=glx,egl
      -  -Dgst-plugins-base:gl_winsys=x11,wayland
      -  -Dgst-plugins-base:x11=enabled
      -  -Dgst-plugins-base:xshm=enabled
  - name: qt-jdenticon
    buildsystem: cmake-ninja
    no-make-install: true
    build-commands:
      - mkdir -p /app/bin/
      - cp libqtjdenticon.so /app/bin/
    sources:
      - commit: 39cde33d4b23b57aa5b94e94071d6ff18d2bd92a
        tag: v0.3.1
        type: git
        url: https://github.com/Nheko-Reborn/qt-jdenticon.git
  - name: coeurl
    buildsystem: meson
    config-opts:
      - -Ddefault_library=static
    sources:
      - commit: f49993e6ad3b2f4fa6503f46d547351fa276ac84
        tag: v0.3.1
        type: git
        url: https://nheko.im/Nheko-Reborn/coeurl.git
  - name: mtxclient
    config-opts:
      - -DBUILD_LIB_TESTS=OFF
      - -DBUILD_LIB_EXAMPLES=OFF
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
    buildsystem: cmake-ninja
    sources:
      - commit: 15b43844f4ec27faa5f2ec92c4ded313206763aa
        tag: v0.10.1
        type: git
        url: https://github.com/Nheko-Reborn/mtxclient.git
  - name: komai
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DLMDBXX_INCLUDE_DIR=.deps/lmdbxx
      - -DCOMPILE_QML=ON
      - -DMAN=OFF
      - -DFLATPAK=ON
    buildsystem: cmake-ninja
    sources:
      - path: ../../..
        type: dir
        skip:
          - build
          - build-flatpak
          - .git
          - var
          - etc
      - dest: .deps/lmdbxx
        sha256: 5e12eb3aefe9050068af7df2c663edabc977ef34c9e7ba7b9d2c43e0ad47d8df
        type: archive
        url: https://github.com/hoytech/lmdbxx/archive/1.0.0.tar.gz
