version: 1
unicode:
  emoji_test:
    # Pinned Unicode release. Keep it in step with the CLDR release below: a
    # newer Unicode than CLDR covers leaves the new emoji without localized
    # names or search keywords.
    #
    # Renovate proposes `version` bumps but cannot update the sha256 pin; run
    # `just emoji-update-lock` after merging a bump, like for CLDR below.
    version: "17.0.0"
    url: "https://www.unicode.org/Public/{version}/emoji/emoji-test.txt"
    sha256: "1d8a944f88d7952f7ef7c5167fef3c67995bcae24543949710231b03a201acda"
cldr:
  # Pinned cldr-json npm release. Annotations come from the two npm tarballs
  # below (2 requests total) instead of ~200 per-locale files from
  # raw.githubusercontent.com, which rate-limits hard enough to break builds.
  #
  # Renovate proposes `version` bumps but cannot update the sha256 pins. After
  # merging a bump, run `just emoji-update-lock` to re-pin them (the pipeline
  # verifies the pins and prints the actual hash on mismatch); then commit the
  # lock change.
  version: "49.0.0"
  annotations_url: "https://registry.npmjs.org/cldr-annotations-full/-/cldr-annotations-full-{version}.tgz"
  annotations_sha256: "ce415a4898da7a4ca755437de2593863c05045fc6b1649d8da5ee05fa3bdc33b"
  derived_url: "https://registry.npmjs.org/cldr-annotations-derived-full/-/cldr-annotations-derived-full-{version}.tgz"
  derived_sha256: "e83ab0348ec09f4b5bb27f658b9c424c9c8fbf512484b728903515b9f01c3c28"
