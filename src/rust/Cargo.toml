[package]
name = "komai-rust"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
rand = "0.10.*"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry"] }
mime = "0.3"
matrix-sdk = { version = "0.16.0", features = ["native-tls", "sqlite"] }
matrix-sdk-ui = { version = "0.16.0", default-features = false, features = ["native-tls"] }

# resolvematrix defaults to reqwest's default-tls (rustls + aws-lc-rs). We override
# to native-tls (OpenSSL) because:
#   1. Komai already links OpenSSL via mtxclient/coeurl — no point bundling a second
#      TLS implementation.
#   2. aws-lc-sys includes C sources that require -O0, which conflicts with build
#      environments that inject optimization flags (Flatpak).
#   3. Fewer dependencies (~48 crates fewer).
resolvematrix = { path = "resolvematrix", default-features = false, features = ["server"] }
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "system-config"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[build-dependencies]
cxx-build = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
