cldr:
  # Pinned cldr-json npm release. Annotations come from the two npm tarballs
  # below (2 requests total) instead of ~200 per-locale files from
  # raw.githubusercontent.com, which rate-limits hard enough to break builds.
  #
  # Renovate proposes `version` bumps but cannot update the sha256 pins. After
  # merging a bump, run `just emoji-update-lock` to re-pin them (the pipeline
  # verifies the pins and prints the actual hash on mismatch); then commit the
  # lock change.
  version: "48.2.0"
  annotations_url: "https://registry.npmjs.org/cldr-annotations-full/-/cldr-annotations-full-{version}.tgz"
  annotations_sha256: "28576e51225deb51e3ddd734b0f824a0079682cb5d8c27faa9f68149317a14d1"
  derived_url: "https://registry.npmjs.org/cldr-annotations-derived-full/-/cldr-annotations-derived-full-{version}.tgz"
  derived_sha256: "4be946ff5815f806ec78b50363d577a769f2fbfb90c6380a44e161a92436996e"
