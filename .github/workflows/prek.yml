name: Prek

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prek:
    runs-on: self-hosted
    container:
      image: docker.io/archlinux:base-devel

    steps:
      # git must be installed before checkout so it does a proper clone
      # (with .git directory) instead of a tarball download.
      - name: Install git
        run: pacman -Sy --noconfirm git

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          # Keep Arch package resolution non-interactive in CI by pinning
          # concrete providers for virtual deps that otherwise trigger prompts:
          # - qt6-multimedia-backend -> qt6-multimedia-ffmpeg
          # - org.freedesktop.secrets -> kwallet
          # - jack -> pipewire-jack (pulled transitively via ffmpeg)
          # Also install python-yaml because the emoji pipeline requires PyYAML.
          pacman -S --noconfirm --needed \
            cmake just python python-yaml mise reuse \
            qt6-base qt6-declarative qt6-tools qt6-multimedia qt6-multimedia-ffmpeg qt6-svg \
            syntax-highlighting \
            coeurl libolm lmdb lmdbxx cmark spdlog fmt re2 openssl \
            nlohmann-json yaml-cpp qtkeychain-qt6 kdsingleapplication litehtml \
            curl libevent libsecret kwallet pipewire-jack

      - name: Configure
        run: |
          # Use system packages where available (same approach as PKGBUILD).
          # Only mtxclient, cpp-httplib, and blurhash are downloaded by CPM.
          # VoIP is disabled to avoid installing GStreamer dependencies.
          just configure \
            -DCPM_USE_LOCAL_PACKAGES=ON \
            -DCPM_MatrixClient_USE_LOCAL=OFF \
            -DVOIP=OFF

      # Build explicitly so it gets its own step with visible output.
      # The prek tests hook would trigger a build anyway, but buried
      # inside "Run prek on all files" with no progress indication.
      - name: Build
        run: just build

      - name: Run prek on all files
        run: |
          # The checkout action sets safe.directory using its own bundled
          # git (/usr/sbin/git), which is separate from the pacman-installed
          # git (/usr/bin/git) that prek uses.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          just prek-run-on-all
