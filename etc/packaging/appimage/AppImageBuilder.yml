# appimage-builder recipe -- see https://appimage-builder.readthedocs.io for details
#
# Usage (via justfile):
#   just appimage-build    # builds komai + produces .AppImage
#   just appimage-clean    # removes var/build/appimage/
#
# The recipe expects the komai binary already installed into AppDir/usr/bin/
# before appimage-builder runs. The justfile recipe handles this automatically.
version: 1
AppDir:
  path: ./AppDir
  app_info:
    id: cc.etke.komai
    name: komai
    icon: cc.etke.komai
    version: latest
    exec: usr/bin/komai
    exec_args: $@
  runtime:
    env:
      APPDIR_LIBRARY_PATH: $APPDIR/usr/lib/@LIB_TUPLE@:$APPDIR/usr/lib/@LIB_TUPLE@/gstreamer-1.0:$APPDIR/usr/lib/@LIB_TUPLE@/gconv:$APPDIR/usr/lib/@LIB_TUPLE@/libproxy:$APPDIR/lib/@LIB_TUPLE@:$APPDIR/usr/lib/@LIB_TUPLE@/pulseaudio
      # QtWebEngine (Element Call). The compiled-in /usr prefix does not resolve
      # inside a relocated AppImage, so point Chromium at the bundled helper,
      # resource paks and locale paks explicitly. The Chromium sandbox needs a
      # setuid helper or unprivileged user namespaces, neither reliable from an
      # AppImage mount, so disable it (the app already runs unconfined).
      QTWEBENGINEPROCESS_PATH: $APPDIR/usr/lib/qt6/libexec/QtWebEngineProcess
      QTWEBENGINE_RESOURCES_PATH: $APPDIR/usr/share/qt6/resources
      QTWEBENGINE_LOCALES_PATH: $APPDIR/usr/share/qt6/translations/qtwebengine_locales
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      # PipeWire (audio capture for speech-to-text and VoIP). The bundled
      # libpipewire has its SPA plugin and module directories compiled in as
      # absolute host paths (/usr/lib/x86_64-linux-gnu/spa-0.2 and .../pipewire-0.3).
      # Those do not resolve inside a relocated AppImage, and on non-Debian hosts
      # they point at a directory that either does not exist or holds a mismatched
      # PipeWire version. Without a usable SPA plugin dir, pw_loop_new() fails with
      # "can't make support.system handle" and Qt aborts the whole process the
      # moment the microphone is opened. Point both at the bundled copies.
      SPA_PLUGIN_DIR: $APPDIR/usr/lib/@LIB_TUPLE@/spa-0.2
      PIPEWIRE_MODULE_DIR: $APPDIR/usr/lib/@LIB_TUPLE@/pipewire-0.3
  apt:
    # The apt arch, mirror, library tuple and AppImage runtime arch below are
    # placeholders filled in per host architecture by
    # etc/packaging/appimage/bin/build-native (x86_64 -> amd64/archive.ubuntu.com,
    # aarch64 -> arm64/ports.ubuntu.com). Quoted so the unrendered template
    # stays valid YAML (a bare leading `@` is a reserved indicator).
    arch: "@APT_ARCH@"
    allow_unauthenticated: true
    sources:
    - sourceline: deb @APT_MIRROR@ resolute main restricted universe multiverse
      key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C
    - sourceline: deb @APT_MIRROR@ resolute-updates main restricted universe multiverse
      key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C
    - sourceline: deb @APT_MIRROR@ resolute-security main restricted universe multiverse
      key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C
    include:
    - ca-certificates

    # Qt6 runtime libraries
    - libqt6core6t64
    - libqt6dbus6
    - libqt6gui6
    - libqt6network6
    - libqt6opengl6
    - libqt6qml6
    - libqt6qmlmodels6
    - libqt6quick6
    - libqt6quickcontrols2-6
    - libqt6quicktemplates2-6
    - libqt6svg6
    - qt6-svg-plugins
    - libqt6widgets6
    - libqt6multimedia6

    # Qt6 QML modules
    - qml6-module-qtquick
    - qml6-module-qtquick-controls
    - qml6-module-qtquick-effects
    - qml6-module-qtquick-layouts
    - qml6-module-qtquick-window
    - qml6-module-qtquick-templates
    - qml6-module-qtquick-dialogs
    - qml6-module-qtquick-particles
    - qml6-module-qtquick-shapes
    - qml6-module-qtmultimedia
    - qml6-module-qtqml
    - qml6-module-qtqml-models
    - qml6-module-qtqml-workerscript
    - qml6-module-qtcore
    - qml6-module-qt-labs-platform
    - qml6-module-qt-labs-settings

    # QtWebEngine (for Element Call). libqt6webenginecore6-bin ships the
    # QtWebEngineProcess helper; libqt6webengine6-data ships the Chromium
    # resource paks, icudtl.dat and locale paks; qml6-module-qtwebengine ships
    # the QML plugin. appimage-builder pulls their transitive deps (nss, etc.).
    - libqt6webenginecore6
    - libqt6webenginecore6-bin
    - libqt6webenginequick6
    - qml6-module-qtwebengine
    - libqt6webengine6-data

    # Application runtime dependencies
    - libqt6keychain1

    # GStreamer (for VoIP/media)
    - gstreamer1.0-plugins-good
    - gstreamer1.0-plugins-bad
    - gstreamer1.0-gl
    - gstreamer1.0-nice
    - gstreamer1.0-pipewire
    - gstreamer1.0-qt6
    - gstreamer1.0-x

    # Qt6 Wayland platform plugin
    - qt6-wayland

    # Proxy support (Qt6 network loads libpxbackend at runtime)
    - libproxy1v5

    # System libraries
    - libbz2-1.0
    - libelf1t64
    - libexpat1
    - libjpeg-turbo8
    - liblz4-1
    - libpcre2-16-0
    - libsnappy1v5
    - libzstd1

    # X11 libraries
    - libxcb1
    - libxcb-ewmh2
    - libxcb-render-util0
    - libxcb-sync1
    - libxcb-xinerama0
    - libxcb-xkb1
    - libxau6
    - libxcursor1
    - libxdmcp6
    - libxext6
    - libxfixes3
    - libxrender1
    - libxshmfence1
    - libxv1
    - libxxf86vm1
    - libsm6

    exclude: []
  files:
    exclude:
    - usr/share/man
    - usr/share/doc
    - usr/bin/dbus*
    - usr/bin/openssl
    - usr/bin/c_rehash
    - usr/bin/session-migration
    - usr/include
    - usr/sbin
    - lib/systemd
  test:
    debian:
      image: appimagecrafters/tests-env:debian-stable
      command: ./AppRun
      use_host_x: true
    arch:
      image: appimagecrafters/tests-env:archlinux-latest
      command: ./AppRun
      use_host_x: true
    ubuntu:
      image: appimagecrafters/tests-env:ubuntu-xenial
      command: ./AppRun
      use_host_x: true
AppImage:
  arch: "@APPIMAGE_ARCH@"
  update-information: None
  sign-key: None
