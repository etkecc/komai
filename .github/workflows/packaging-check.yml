name: Packaging check

# Manually-triggered sanity check for the AppImage / Flatpak / Snap / Windows
# build recipes. The amd64 Linux jobs run on the self-hosted k150 runner; arm64
# Linux jobs run on a GitHub-hosted ubuntu-24.04-arm image (free for public
# repos), and the Windows job on a GitHub-hosted windows-2025-vs2026 image.
# Used to iterate on each packaging format independently before relying on it
# from publish.yml, and kept long-term for periodic runtime/SDK drift checks
# (e.g. Flathub KDE bumps).

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Which packaging format to build"
        type: choice
        default: all
        options:
          - all
          - appimage
          - appimage-arm64
          - flatpak
          - flatpak-arm64
          - snap
          - snap-arm64
          - macos-arm64
          - windows

permissions:
  contents: read

concurrency:
  group: packaging-check-${{ github.ref }}-${{ inputs.format }}
  cancel-in-progress: true

jobs:
  appimage:
    if: inputs.format == 'all' || inputs.format == 'appimage'
    runs-on: [self-hosted, k150]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache emoji upstream data
        # Exact-key only: the key is the lock-file hash, so any lock change
        # misses and re-fetches from the sha256-pinned sources.
        uses: actions/cache@v6
        with:
          path: var/emoji/cache
          key: emoji-cache-${{ hashFiles('bin/emoji/sources.lock.yml') }}

      - name: Build AppImage
        run: just appimage-build-docker

      - name: Upload AppImage artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-appimage
          path: var/build/appimage/*.AppImage
          if-no-files-found: error

  appimage-arm64:
    # GitHub-hosted arm64 runner (free for public repos); the k150 self-hosted
    # runner is amd64-only. The Docker base image (ubuntu:26.04) is multi-arch,
    # so `appimage-build-docker` runs natively on the arm64 host -- no QEMU.
    # `just` is not preinstalled on GitHub-hosted runners (Docker is), so it is
    # installed first.
    if: inputs.format == 'all' || inputs.format == 'appimage-arm64'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin

      - name: Cache emoji upstream data
        # Exact-key only: the key is the lock-file hash, so any lock change
        # misses and re-fetches from the sha256-pinned sources.
        uses: actions/cache@v6
        with:
          path: var/emoji/cache
          key: emoji-cache-${{ hashFiles('bin/emoji/sources.lock.yml') }}

      - name: Build AppImage
        run: just appimage-build-docker

      - name: Upload AppImage artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-appimage-arm64
          path: var/build/appimage/*.AppImage
          if-no-files-found: error

  flatpak:
    if: inputs.format == 'all' || inputs.format == 'flatpak'
    runs-on: [self-hosted, k150]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache emoji upstream data
        # Exact-key only: the key is the lock-file hash, so any lock change
        # misses and re-fetches from the sha256-pinned sources.
        uses: actions/cache@v6
        with:
          path: var/emoji/cache
          key: emoji-cache-${{ hashFiles('bin/emoji/sources.lock.yml') }}

      - name: Build Flatpak
        run: just flatpak-build

      - name: Upload Flatpak artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-flatpak
          path: var/build/flatpak/komai-*.flatpak
          if-no-files-found: error

  flatpak-arm64:
    # GitHub-hosted arm64 runner (the k150 self-hosted runner is amd64-only).
    # Unlike AppImage/Snap, `flatpak-build` runs on-host (no container), so
    # flatpak + flatpak-builder must be installed here (Docker-free). The
    # recipe adds the flathub --user remote and pulls the aarch64
    # org.kde.Platform/Sdk via --install-deps-from=flathub, and already uses
    # --disable-rofiles-fuse + --user so it works in CI without polkit/fuse.
    # `just` is not preinstalled on GitHub-hosted runners.
    if: inputs.format == 'all' || inputs.format == 'flatpak-arm64'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just, flatpak and flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin

      - name: Cache emoji upstream data
        # Exact-key only: the key is the lock-file hash, so any lock change
        # misses and re-fetches from the sha256-pinned sources.
        uses: actions/cache@v6
        with:
          path: var/emoji/cache
          key: emoji-cache-${{ hashFiles('bin/emoji/sources.lock.yml') }}

      - name: Build Flatpak
        run: just flatpak-build

      - name: Upload Flatpak artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-flatpak-arm64
          path: var/build/flatpak/komai-*.flatpak
          if-no-files-found: error

  snap:
    if: inputs.format == 'all' || inputs.format == 'snap'
    runs-on: [self-hosted, k150]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache emoji upstream data
        # Exact-key only: the key is the lock-file hash, so any lock change
        # misses and re-fetches from the sha256-pinned sources.
        uses: actions/cache@v6
        with:
          path: var/emoji/cache
          key: emoji-cache-${{ hashFiles('bin/emoji/sources.lock.yml') }}

      - name: Build Snap
        run: just snap-build-docker

      - name: Upload Snap artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-snap
          path: var/build/snap/komai_*.snap
          if-no-files-found: error

  snap-arm64:
    # GitHub-hosted arm64 runner (the k150 self-hosted runner is amd64-only).
    # The snapcraft builder image (ghcr.io/canonical/snapcraft) is multi-arch,
    # so `snap-build-docker` runs natively on the arm64 host -- no QEMU. `just`
    # is not preinstalled on GitHub-hosted runners (Docker is), so it is
    # installed first.
    if: inputs.format == 'all' || inputs.format == 'snap-arm64'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin

      - name: Cache emoji upstream data
        # Exact-key only: the key is the lock-file hash, so any lock change
        # misses and re-fetches from the sha256-pinned sources.
        uses: actions/cache@v6
        with:
          path: var/emoji/cache
          key: emoji-cache-${{ hashFiles('bin/emoji/sources.lock.yml') }}

      - name: Build Snap
        run: just snap-build-docker

      - name: Upload Snap artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-snap-arm64
          path: var/build/snap/komai_*.snap
          if-no-files-found: error

  macos-arm64:
    # GitHub-hosted Apple-Silicon runner; explicit pin matches publish.yml.
    # `macos-latest` would auto-bump on GitHub re-aliasing.
    if: inputs.format == 'all' || inputs.format == 'macos-arm64'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache emoji upstream data
        # Exact-key only: the key is the lock-file hash, so any lock change
        # misses and re-fetches from the sha256-pinned sources.
        uses: actions/cache@v6
        with:
          path: var/emoji/cache
          key: emoji-cache-${{ hashFiles('bin/emoji/sources.lock.yml') }}

      - name: Build macOS arm64 DMG
        uses: ./.github/actions/build-macos-dmg

  windows:
    # GitHub-hosted runner; explicit pin matches publish.yml.
    if: inputs.format == 'all' || inputs.format == 'windows'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache emoji upstream data
        # Exact-key only: the key is the lock-file hash, so any lock change
        # misses and re-fetches from the sha256-pinned sources.
        uses: actions/cache@v6
        with:
          path: var/emoji/cache
          key: emoji-cache-${{ hashFiles('bin/emoji/sources.lock.yml') }}

      - name: Build Windows no-installer zip
        uses: ./.github/actions/build-windows-zip
