name: CI

# Pipeline overview, cache strategy, and design rationale:
#   docs/architecture/ci.md

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: [self-hosted, k150]
    container:
      # Pre-baked image with every pacman dep installed and a non-root
      # `ci` user whose UID matches the host runner. See etc/ci/Dockerfile
      # and .github/workflows/ci-image.yml for how it's built.
      image: ghcr.io/etkecc/komai/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Mount the host-provisioned cache disk into the container.
      # On k150 this resolves to a dedicated 50 GB ext4 volume
      # (provisioned via Ansible) where cargo state persists across
      # jobs, eliminating the actions/cache round-trip for the cargo
      # target dir. On runners without this path, Docker transparently
      # creates an empty dir at the bind-mount source — the "Compute
      # unified cargo target dir" step below detects the absent
      # provisioning by checking for the `cargo-target` subdir
      # (created by Ansible, not Docker) and falls back to the
      # in-workspace cache + actions/cache. Workflow remains portable.
      volumes:
        - /var/lib/komai-ci:/var/lib/komai-ci

    env:
      # Keep rustup + cargo state inside the workspace (instead of the
      # persistent-across-jobs /github/home bind mount, which can carry
      # root-owned residue from prior runs). Also makes these paths
      # cacheable via actions/cache below.
      CARGO_HOME: ${{ github.workspace }}/var/cache/cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/var/cache/rustup
      # CARGO_TARGET_DIR is set dynamically by the "Compute unified
      # cargo target dir" step below — it has to match Corrosion's own
      # computed path, which depends on ${GITHUB_WORKSPACE}. See that
      # step for the full explanation.
      # ccache wraps both C and C++ compiles; CMake enables it via the
      # -DCMAKE_{C,CXX}_COMPILER_LAUNCHER=ccache flags on Configure.
      # CCACHE_DIR defaults to a workspace path; the "Wire host-mounted
      # ccache" step below overrides it via $GITHUB_ENV when the
      # provisioned cache disk is present, so subsequent steps and
      # the ccache binary itself see the new value.
      CCACHE_DIR: ${{ github.workspace }}/var/cache/ccache
      CCACHE_MAXSIZE: "2G"
      CCACHE_COMPRESS: "true"
      # Without these sloppiness flags, ccache refuses to cache any
      # compile using precompiled headers — and target_precompile_headers
      # is set on the main `komai` target, which is 85% of the build. The
      # flags tell ccache that PCH define hashes, __TIME__/__DATE__
      # macros, and header mtimes/ctimes can vary without changing the
      # actual output. Standard ccache-with-PCH configuration.
      CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_mtime,include_file_ctime"
      # Hash the compiler binary's content, not its mtime+size (the
      # default). Inside the weekly-rebuilt CI image the default proved
      # unreliable: after the 2026-07-13 image refresh bumped gcc, the
      # persistent ccache kept serving 100%-hit objects compiled by the
      # previous gcc, and linking them under the new toolchain produced
      # a komai binary that segfaulted at startup (completions-check,
      # exit 139). Content hashing costs a few ms per compile and makes
      # a compiler change miss by construction.
      CCACHE_COMPILER_CHECK: "content"
      # Route Rust/Corrosion link steps through mold. Target-scoped
      # rustflags only apply to the actual target triple builds; host
      # build-deps (proc-macros, build.rs) are left alone, which avoids
      # churn for small/fast links where mold's setup cost is wasted.
      # Local A/B on this workstation: Rust incremental rebuild 3.37s ->
      # 2.93s (-13%) and peak RSS 3.3 GB -> 1.0 GB. Cold full Rust test
      # build wall-time delta is smaller (~5%) because compile dominates.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute unified cargo target dir
        # Corrosion passes `--target-dir <path>` on its cargo CLI
        # invocation (Corrosion.cmake `_add_cargo_build`, line ~898),
        # which OVERRIDES the CARGO_TARGET_DIR env var. The path is
        # computed at CMake-configure time as:
        #     ${CMAKE_BINARY_DIR}/cargo/${folder}_${sha1_abs_path:0:5}
        # where `folder` is the manifest's parent dir name ("rust" for
        # src/rust/Cargo.toml) and the SHA1 input is the *absolute*
        # manifest path. As of Corrosion v0.6.1 and upstream master
        # (2026-04) there is no knob to override this.
        #
        # Before this step existed, CARGO_TARGET_DIR was set to an
        # unrelated path (var/cache/cargo-target). Corrosion ignored
        # the env var and wrote release artefacts to its own path,
        # which the cache step below was never pointed at. Net effect:
        # the main `just build` ran cold every CI run, and only
        # `cargo test --lib` (which honors the env var) benefited
        # from caching.
        #
        # Fix: replicate Corrosion's path formula here and export it
        # as CARGO_TARGET_DIR. Both writers — Corrosion's cargo and
        # direct `cargo test --lib` — now converge on a single tree.
        #
        # Host-mount optimization: when /var/lib/komai-ci/cargo-target
        # exists on the runner (k150 provisions it via Ansible, see
        # the `volumes:` entry on the container block above), symlink
        # var/build/native/cargo to it. Corrosion's computed path —
        # var/build/native/cargo/rust_<hash> — then resolves through
        # the symlink onto the dedicated cache disk, persisting cargo
        # state across jobs without any actions/cache round-trip
        # (~3 min restore + ~11 min lock-change save eliminated).
        #
        # Detection uses the `cargo-target` subdir specifically (not
        # /var/lib/komai-ci itself): on a runner without provisioning,
        # Docker auto-creates the bind-mount source as an empty dir,
        # so /var/lib/komai-ci will exist but the Ansible-created
        # subdir won't. Setting HOST_CACHE distinguishes the two
        # cases for the cache step's `if:` gating below.
        #
        # Scope deliberately narrow: only the `cargo/` subdir is
        # symlinked, NOT the whole CMake build dir. C++/CMake state
        # stays ephemeral-per-job and is kept warm via ccache —
        # avoids accumulating stale CMakeCache or generated moc/uic
        # outputs across runs.
        run: |
          MANIFEST="${GITHUB_WORKSPACE}/src/rust/Cargo.toml"
          HASH=$(printf '%s' "${MANIFEST}" | sha1sum | cut -c1-5)
          UNIFIED="${GITHUB_WORKSPACE}/var/build/native/cargo/rust_${HASH}"
          echo "CARGO_TARGET_DIR=${UNIFIED}" >> "${GITHUB_ENV}"

          if [ -d /var/lib/komai-ci/cargo-target ]; then
            mkdir -p "${GITHUB_WORKSPACE}/var/build/native"
            ln -sfn /var/lib/komai-ci/cargo-target "${GITHUB_WORKSPACE}/var/build/native/cargo"
            echo "HOST_CACHE=true" >> "${GITHUB_ENV}"
            echo "Host-mount active: cargo state persists at /var/lib/komai-ci/cargo-target"
          else
            echo "HOST_CACHE=false" >> "${GITHUB_ENV}"
            echo "No host-mount detected; falling back to in-workspace path + actions/cache"
          fi
          echo "Unified cargo target dir: ${UNIFIED}"

      - name: Wire host-mounted ccache
        # Mirrors the cargo-target host-mount pattern: when the
        # provisioned cache disk is present (HOST_CACHE=true from
        # the compute step above), point CCACHE_DIR at a subdir on
        # it so ccache state persists across jobs without an
        # actions/cache round-trip. On the validated baseline this
        # eliminates ~2 min of Post Cache ccache save per run.
        # On runners without the host-mount, CCACHE_DIR keeps its
        # job-level default (workspace path) and the actions/cache
        # step below runs as before — workflow stays portable.
        #
        # Graceful mkdir fallback: /var/lib/komai-ci itself may be
        # root-owned with restrictive perms (the Ansible role only
        # chmod 0777's the cargo-target subdir). The container runs
        # as a non-root user, so an unguarded mkdir of a sibling
        # subdir would fail and red the build. We try the mkdir and
        # fall back to leaving CCACHE_DIR at its job-level default
        # if it fails — the Cache ccache step below uses a separate
        # CCACHE_HOST_OK flag (not HOST_CACHE) so it stays active
        # on actions/cache in that case. Once the Ansible role
        # chmods /var/lib/komai-ci itself (or pre-creates ccache
        # the same way it pre-creates cargo-target), this branch
        # transparently activates the host-mounted ccache.
        if: env.HOST_CACHE == 'true'
        run: |
          CCACHE_HOST_DIR=/var/lib/komai-ci/ccache
          if mkdir -p "${CCACHE_HOST_DIR}" 2>/dev/null; then
            echo "CCACHE_DIR=${CCACHE_HOST_DIR}" >> "${GITHUB_ENV}"
            echo "CCACHE_HOST_OK=true" >> "${GITHUB_ENV}"
            echo "Host-mounted ccache active at ${CCACHE_HOST_DIR}"
          else
            echo "Cannot mkdir ${CCACHE_HOST_DIR} (host /var/lib/komai-ci"
            echo "may need broader chmod — see Ansible role). Falling back"
            echo "to actions/cache for ccache; cargo-target stays host-mounted."
          fi

      - name: Invalidate host-mounted cargo target on toolchain change
        # The persistent cargo target dir outlives the weekly CI image
        # refresh, but cargo does not track the system C toolchain as a
        # rebuild input: `cc`-crate build scripts (ring, zstd-sys, ...)
        # cache .o files compiled by whatever gcc the *previous* image
        # shipped, and cargo reuses them verbatim under the new one.
        # Linking those stale objects with a newer gcc/glibc produced a
        # binary that segfaulted at startup (completions-check, exit 139)
        # after the 2026-07-13 image refresh bumped gcc. Fingerprint the
        # toolchain packages and wipe the cargo tree when it changes; the
        # next build repopulates it in one cold run. ccache needs no such
        # guard — it keys on the compiler binary itself.
        if: env.HOST_CACHE == 'true'
        run: |
          STAMP=/var/lib/komai-ci/cargo-target/.toolchain-stamp
          CURRENT=$(pacman -Q gcc glibc binutils mold)
          if [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "$CURRENT" ]; then
            echo "Toolchain unchanged; keeping persistent cargo target"
          else
            echo "Toolchain changed or stamp missing; wiping persistent cargo target"
            [ -f "$STAMP" ] && { echo "--- was:"; cat "$STAMP"; }
            echo "--- now:"; echo "$CURRENT"
            find /var/lib/komai-ci/cargo-target -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            printf '%s\n' "$CURRENT" > "$STAMP"
          fi

      # ---------- Caches --------------------------------------------------
      # Each cache is restored before its consumer step. Saves happen
      # automatically at end of job on successful completion.

      - name: Cache rustup toolchains
        uses: actions/cache@v6
        with:
          path: var/cache/rustup
          key: rustup-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            rustup-

      - name: Cache cargo registry + git db
        uses: actions/cache@v6
        with:
          path: |
            var/cache/cargo-home/registry/index
            var/cache/cargo-home/registry/cache
            var/cache/cargo-home/git/db
          key: cargo-home-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: |
            cargo-home-

      - name: Cache ccache
        # Gated by CCACHE_HOST_OK (set by the Wire step above):
        # skipped only when the host-mounted ccache subdir is both
        # present AND writable. Runs in every other case —
        # including: (a) runner without the host-mount at all,
        # (b) host-mount present but the ccache subdir mkdir
        # failed (perm gap pending an Ansible-side fix).
        if: env.CCACHE_HOST_OK != 'true'
        uses: actions/cache@v6
        with:
          path: var/cache/ccache
          # Per-commit save so each run writes its own snapshot; restore
          # falls through to the current branch then main then any cache.
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-main-
            ccache-

      - name: Cache cargo target dir
        # Gated by HOST_CACHE (set in the compute step above): on
        # runners with the host-mounted cache disk, cargo state
        # persists directly there and this step is a no-op (both
        # restore and the corresponding Post Cache save are
        # skipped, eliminating ~3 min restore + ~11 min lock-change
        # save). On any runner without the host-mount the step
        # runs as before — workflow stays portable.
        if: env.HOST_CACHE != 'true'
        uses: actions/cache@v6
        with:
          # `var/build/native/cargo` is Corrosion's parent target-dir
          # location (CMAKE_BINARY_DIR=var/build/native, Corrosion puts
          # cargo output under the `cargo/` subdir). The unified
          # CARGO_TARGET_DIR from the compute step above points at
          # `var/build/native/cargo/rust_<hash>` inside this tree, so
          # both Corrosion and `cargo test --lib` populate one subtree
          # that this cache captures whole.
          #
          # The `incremental/` subtree regenerates cheaply from scratch
          # (dep-graph.bin + query-cache.bin total hundreds of MB but
          # rustc rebuilds them per-compile). Excluding saves ~25% on
          # cache transfer — meaningful since GH's cache backend from
          # the k150 runner is ~10 MB/s.
          path: |
            var/build/native/cargo
            !var/build/native/cargo/**/incremental/**
          # Cache key intentionally hashes only Cargo.lock + the
          # rustc toolchain pin — NOT the commit SHA. Rationale:
          #
          # Cargo fingerprints for the ~1000 dependency crates are
          # determined by resolved dep versions (Cargo.lock) and
          # rustc version (rust-toolchain.toml). Our own source code
          # doesn't affect those fingerprints — only our own crate,
          # which rebuilds cheaply on every run (~1-2 min on this
          # runner). So a re-saved tarball on an unchanged-lock
          # commit would be nearly identical to the existing entry.
          #
          # With this key, actions/cache detects that the primary
          # key already exists in the cache and SKIPS the Post Cache
          # save step entirely. On the measured seed run that step
          # took ~11 min (most of it uploading ~2-3 GB compressed to
          # GH's cache backend over k150's ~10 MB/s link). Skipping
          # it on every lock-unchanged commit is the biggest single
          # CI-wall-time lever available.
          #
          # TTL: GH evicts caches after 7 days of non-access. A
          # successful restore counts as access and resets the
          # clock, so the entry stays alive as long as CI is active.
          # A 7+ day silence would force a cold full rebuild on the
          # next run — acceptable given Komai's activity level. If
          # we ever go quiet for that long, a one-off cold run is a
          # small price.
          #
          # The `v2-` prefix is a manual version gate. If anything
          # in this workflow changes the rustc/cargo command line in
          # a fingerprint-affecting way (RUSTFLAGS, linker choice,
          # profile tweaks, etc.), bump to `v3-` so we don't restore
          # stale entries built with different flags.
          key: cargo-target-v2-${{ hashFiles('src/rust/Cargo.lock', 'rust-toolchain.toml') }}
          # Cascade fallback: on Cargo.lock or toolchain changes the
          # primary key misses. Matching any previous `cargo-target-v2-`
          # entry gives us a warm starting dep tree; cargo's
          # fingerprinting then rebuilds only the crates that actually
          # changed (typically a handful per Renovate bump), which is
          # dramatically cheaper than starting from an empty target
          # dir. The new primary-key entry is then saved at end of job.
          restore-keys: |
            cargo-target-v2-

      - name: Cache mise + prek
        uses: actions/cache@v6
        with:
          path: |
            var/mise
            var/prek
          key: mise-prek-${{ hashFiles('mise.toml', '.pre-commit-config.yaml') }}
          restore-keys: |
            mise-prek-

      # ---------- Build ---------------------------------------------------

      - name: Warm Rust toolchain
        # Installs the repo-pinned toolchain before CMake/Corrosion
        # enumerates it during configure. Cached across runs by the
        # rustup cache step above.
        run: cargo --version

      - name: ccache — reset stats
        run: ccache --zero-stats

      - name: Configure
        run: |
          # Use system packages where available (same approach as PKGBUILD).
          # ccache accelerates re-compiles of unchanged C/C++ sources.
          # CMAKE_LINKER_TYPE=MOLD routes the C++ link (komai binary +
          # each komai_*_test) through mold. Local A/B for the komai
          # binary link: 4.90s -> 1.73s (-65%), peak RSS 1.2 GB -> 108 MB.
          just configure \
            -DCPM_USE_LOCAL_PACKAGES=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_LINKER_TYPE=MOLD

      - name: Cache emoji upstream data
        # Exact-key only: the key is the lock-file hash, so any lock change
        # misses and re-fetches from the sha256-pinned sources.
        uses: actions/cache@v6
        with:
          path: var/emoji/cache
          key: emoji-cache-${{ hashFiles('bin/emoji/sources.lock.yml') }}

      # Build explicitly so it gets its own step with visible output.
      # The prek tests hook would trigger a build anyway, but buried
      # inside "Lint & test" with no progress indication.
      - name: Build
        run: just build

      - name: ccache — show stats
        run: ccache --show-stats -v

      # The three steps below used to be a single "Lint & test" step that
      # ran `just prek-run-on-all`. Splitting surfaces per-step timing in
      # the GH Actions UI: the `tests` prek hook calls `just test`, which
      # builds `komai_tests` and runs cargo test against a different
      # feature set than the main build -- so it's worth measuring
      # separately from the fast lint hooks.

      - name: Lint (prek hooks, excluding tests)
        run: |
          # The checkout action sets safe.directory using its own bundled
          # git (/usr/sbin/git), which is separate from the pacman-installed
          # git (/usr/bin/git) that prek uses.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          just prek-run-on-all --skip tests

      - name: Build & run C++ tests
        run: just test-cpp

      - name: Run Rust unit tests
        run: just test-rust-unit
