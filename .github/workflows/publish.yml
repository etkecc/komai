name: Publish

# Fires after CI succeeds on a `v*` tag push. Builds AppImage, Flatpak,
# and Snap bundles for both amd64 (self-hosted k150 runner) and arm64
# (free GitHub-hosted ubuntu-24.04-arm runner), plus a Windows x64
# no-installer ZIP and a macOS arm64 DMG on GitHub-hosted runners, then
# creates a GitHub Release with the CHANGELOG section for that version as
# release notes and all artefacts attached.
#
# Pipeline overview, cache strategy, and design rationale:
#   docs/architecture/ci.md

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]

permissions:
  contents: read

concurrency:
  # Scope to the tagged commit so re-runs for the same tag serialise.
  group: publish-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  build-appimage-amd64:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch || '', 'v')
    runs-on: [self-hosted, k150]
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build AppImage
        run: just appimage-build-docker

      - name: Upload AppImage artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-appimage-amd64
          path: var/build/appimage/*.AppImage
          if-no-files-found: error

  build-appimage-arm64:
    # Free GitHub-hosted arm64 runner (the k150 self-hosted runner is
    # amd64-only). The ubuntu:26.04 Docker base is multi-arch, so the build
    # runs natively without QEMU. `just` is not preinstalled on GitHub-hosted
    # runners (Docker is), so it is installed first.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch || '', 'v')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin

      - name: Build AppImage
        run: just appimage-build-docker

      - name: Upload AppImage artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-appimage-arm64
          path: var/build/appimage/*.AppImage
          if-no-files-found: error

  build-flatpak-amd64:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch || '', 'v')
    runs-on: [self-hosted, k150]
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Wire host-mounted flatpak-builder state
        # Mirrors the ci.yml host-mount pattern (see
        # docs/architecture/ci.md). When /var/lib/komai-ci is
        # writable on the runner host, flatpak-builder's whole
        # build directory lives on the dedicated cache disk: no
        # actions/cache round-trip (the state can be ~multi-GB per
        # release). `build-flatpak-amd64` runs directly on the host (no
        # `container:` block), so we wire the symlink directly to a
        # host path without needing a `volumes:` bind-mount on the
        # job. Falls back to actions/cache below if the host-mount
        # is absent (workflow stays portable).
        #
        # We symlink `var/build/flatpak/` (the whole dir) rather
        # than only `.flatpak-builder/`. flatpak-builder rejects a
        # state-dir on a different filesystem from the target-dir;
        # on k150 the cache disk (/var/lib/komai-ci, /dev/vdd) and
        # the workspace (/home/runner, /dev/vdc) are separate FSes,
        # so symlinking only the state-dir tripped that check.
        # Symlinking the parent makes both paths resolve through
        # the same symlink onto /dev/vdd.
        run: |
          if mkdir -p /var/lib/komai-ci/flatpak-build 2>/dev/null; then
            mkdir -p var/build
            ln -sfn /var/lib/komai-ci/flatpak-build var/build/flatpak
            echo "FLATPAK_HOST_OK=true" >> "${GITHUB_ENV}"
            echo "Host-mounted flatpak build dir active"
          else
            echo "FLATPAK_HOST_OK=false" >> "${GITHUB_ENV}"
            echo "No host-mount; falling back to actions/cache"
          fi

      # Persist flatpak-builder's state-dir across releases. The dir
      # accumulates OSTree module caches, downloaded source tarballs,
      # and an internal ccache — which together turn a 41 min cold
      # build into a ~7-8 min warm one (measured locally 2026-04-24).
      # Keyed on the flatpak manifest hash so SDK/dep bumps invalidate
      # cleanly. No restore-keys fallback: a wildcard prefix would let
      # any prior cache entry restore here and could be poisoned by a
      # malicious tag push (code-scanning actions/cache-poisoning).
      # Manifest bumps cold-build, which is the intended behaviour.
      #
      # Gated by FLATPAK_HOST_OK from the wire step above: skipped
      # on runners with the host-mounted cache disk (state persists
      # there directly). Runs as before on any other runner.
      - name: Cache flatpak-builder state
        if: env.FLATPAK_HOST_OK != 'true'
        uses: actions/cache@v6
        with:
          path: var/build/flatpak/.flatpak-builder
          key: flatpak-state-${{ hashFiles('etc/packaging/flatpak/cc.etke.komai.yaml') }}

      - name: Build Flatpak
        run: just flatpak-build

      - name: Upload Flatpak artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-flatpak-amd64
          path: var/build/flatpak/komai-*.flatpak
          if-no-files-found: error

  build-flatpak-arm64:
    # Free GitHub-hosted arm64 runner. flatpak-build runs on-host (no
    # container), so flatpak + flatpak-builder are installed here. The
    # k150 host-mount cache path doesn't apply, so flatpak-builder state is
    # persisted via actions/cache instead -- keyed on the manifest hash with
    # no restore-keys fallback (same cache-poisoning rationale as the amd64
    # job; the arch in the key keeps it separate from the amd64 fallback
    # cache).
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch || '', 'v')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install just, flatpak and flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin

      - name: Cache flatpak-builder state
        uses: actions/cache@v6
        with:
          path: var/build/flatpak/.flatpak-builder
          key: flatpak-state-arm64-${{ hashFiles('etc/packaging/flatpak/cc.etke.komai.yaml') }}

      - name: Build Flatpak
        run: just flatpak-build

      - name: Upload Flatpak artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-flatpak-arm64
          path: var/build/flatpak/komai-*.flatpak
          if-no-files-found: error

  build-snap-amd64:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch || '', 'v')
    runs-on: [self-hosted, k150]
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build Snap
        run: just snap-build-docker

      - name: Upload Snap artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-snap-amd64
          path: var/build/snap/komai_*.snap
          if-no-files-found: error

  build-snap-arm64:
    # Free GitHub-hosted arm64 runner. The snapcraft builder image
    # (ghcr.io/canonical/snapcraft) is multi-arch, so snap-build-docker runs
    # natively without QEMU. `just` is installed first (Docker is preinstalled).
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch || '', 'v')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin

      - name: Build Snap
        run: just snap-build-docker

      - name: Upload Snap artefact
        uses: actions/upload-artifact@v7
        with:
          name: komai-snap-arm64
          path: var/build/snap/komai_*.snap
          if-no-files-found: error

  build-windows-x64:
    # Explicit OS pin matching every other dep in the repo (Qt, Rust,
    # AppImage builder image, flatpak SDK, etc.); see the
    # build-windows-zip composite for the trade-off rationale.
    # `windows-latest` would auto-bump on GitHub re-aliasing and drag
    # in surprise toolchain changes.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch || '', 'v')
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build Windows no-installer zip
        uses: ./.github/actions/build-windows-zip

  build-macos-arm64:
    # Apple-Silicon-only (Intel deliberately out of scope — see the
    # build-macos-dmg composite's description for the rationale). Pin
    # matches packaging-check.yml; `macos-latest` would auto-bump on
    # GitHub re-aliasing and drag in surprise toolchain changes.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch || '', 'v')
    runs-on: macos-26
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build macOS arm64 DMG
        uses: ./.github/actions/build-macos-dmg

  release:
    needs:
      - build-appimage-amd64
      - build-appimage-arm64
      - build-flatpak-amd64
      - build-flatpak-arm64
      - build-snap-amd64
      - build-snap-arm64
      - build-windows-x64
      - build-macos-arm64
    runs-on: [self-hosted, k150]
    # Runs inside the CI image so `python3` and the `gh` CLI come from
    # the image, not the host. Keeps the release-creation path
    # self-contained instead of tying it to another host package.
    container:
      image: ghcr.io/etkecc/komai/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          path: artefacts

      - name: Stage artefacts under var/build/
        # `bin/release/publish.py` looks for artefacts at the standard
        # local layout (var/build/<format>/<file>). actions/download-artifact
        # produces them under artefacts/<artifact-name>/. The Linux formats
        # ship two arches each (komai-<format>-amd64 + komai-<format>-arm64),
        # whose files have arch-distinct names, so both are copied into the
        # single var/build/<format>/ dir. This lets the same script that
        # drives `just release-manual-publish` locally also drive the release
        # step here -- single source of truth for CHANGELOG extraction and
        # the `gh release create` invocation.
        run: |
          set -euo pipefail
          mkdir -p var/build/appimage var/build/flatpak var/build/snap \
                   var/build/windows var/build/macos
          cp artefacts/komai-appimage-*/*.AppImage var/build/appimage/
          cp artefacts/komai-flatpak-*/*.flatpak   var/build/flatpak/
          cp artefacts/komai-snap-*/*.snap         var/build/snap/
          cp artefacts/komai-windows/*.zip         var/build/windows/
          cp artefacts/komai-macos-arm64/*.dmg     var/build/macos/

      - name: Verify tag matches VERSION.txt
        # `bin/prek/version-drift.sh` already guarantees VERSION.txt /
        # PKGBUILD / CHANGELOG / appdata.xml.in agree at commit time;
        # this just verifies the *tag* name lines up with the VERSION.txt
        # file the tagged commit contains. publish.py reads VERSION.txt
        # to derive the tag it publishes for, so a mismatch here would
        # silently produce a wrongly-named release.
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION.txt)"
          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Tag '${TAG}' does not match 'v${VERSION}' from VERSION.txt." >&2
            echo "Refusing to publish a release where the tag and VERSION.txt disagree." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        # publish.py extracts the matching CHANGELOG section, verifies
        # the four artefacts exist at their expected paths, and runs
        # `gh release create`. Same code path as `just release-manual-publish`
        # locally -- see docs/maintainers/releases.md.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 bin/release/publish.py
