name: Prek

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-24.04
    container:
      image: docker.io/archlinux:base-devel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm --needed \
            cmake just git python mise \
            qt6-base qt6-declarative qt6-tools qt6-multimedia qt6-svg \
            mtxclient coeurl libolm lmdb lmdbxx cmark spdlog fmt re2 openssl \
            nlohmann-json yaml-cpp qtkeychain-qt6 kdsingleapplication \
            curl libevent libsecret

      - name: Run prek on all files
        run: |
          # The checkout action's safe.directory config targets the host
          # git, not the container's git installed via pacman.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # VoIP is disabled to avoid installing GStreamer dependencies.
          just configure -DVOIP=OFF
          just prek-run-on-all
