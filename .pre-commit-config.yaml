repos:
  # Fast built-in hooks (Rust-native, no dependencies)
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '\.clang-format$'
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # Deterministic clang-format toolchain managed by pre-commit (fast, prebuilt).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        name: Format C/C++ sources
        files: '^src/.*\.(cpp|h)$'

  # Local hooks that run project-specific tools
  - repo: local
    hooks:
      - id: check-serverlist
        name: Check Server List Localization
        entry: python3 bin/serverlist/check.py
        language: system
        files: '(resources/serverlist/.*\.yml$|bin/serverlist/)'
        pass_filenames: false
      - id: check-theme-yaml
        name: Check Theme YAML Validity
        entry: python3 bin/theme/check.py
        language: system
        files: '(resources/themes/.*\.yml$|bin/theme/)'
        pass_filenames: false
      - id: builtin-theme-wcag-aa
        name: Enforce Built-in Theme WCAG AA Contrast
        entry: ./bin/prek/theme-contrast-aa.sh
        language: system
        files: '^(resources/themes/.*\.yml|bin/theme/contrast\.py|bin/theme/colors\.py|bin/prek/theme-contrast-aa\.sh)$'
        pass_filenames: false
      - id: check-ts-normalized
        name: Check Translation Files Normalized
        entry: python3 bin/translations/check-normalized.py
        language: system
        files: 'resources/langs/.*\.ts$'
        pass_filenames: false
      - id: translations-drift
        name: Verify translation .ts files are in sync with source
        entry: python3 bin/prek/translations-drift.py
        language: system
        files: '^(src/.*\.(cpp|h)|resources/qml/.*\.qml|bin/translations/.*|bin/prek/translations-drift\.py)$'
        pass_filenames: false
      - id: qmllint
        name: Lint QML files
        entry: ./bin/prek/qml/qmllint.sh
        language: system
        files: '^resources/qml/.*\.qml$'
      - id: no-bare-controls
        name: Forbid bare Qt controls in QML (use Komai variants)
        entry: ./bin/prek/qml/no-bare-controls.sh
        language: system
        files: '^resources/qml/.*\.qml$'
        pass_filenames: false
      - id: no-qsettings
        name: Forbid QSettings usage
        entry: ./bin/prek/no-qsettings.sh
        language: system
        files: '^src/.*\.(cpp|h)$'
        pass_filenames: false
      - id: db-boundary
        name: Enforce db module boundaries
        entry: ./bin/prek/db-boundary.sh
        language: system
        files: '^(src/db/.*\.(cpp|h)|bin/prek/db-boundary\.sh|docs/architecture/storage\.md|docs/architecture/cache/README\.md)$'
        pass_filenames: false
      - id: icons-audit
        name: Audit icon references and resource registration
        entry: ./bin/icons/audit.sh --strict
        language: system
        files: '^(resources/icons/.*\.svg|resources/res\.qrc|resources/qml/.*\.qml|src/.*\.(cpp|h)|bin/icons/.*)$'
        pass_filenames: false
      - id: icons-list-check
        name: Verify generated icon catalog is up to date
        entry: python3 bin/icons/generate-list.py --check
        language: system
        files: '^(resources/res\.qrc|resources/icons/.*\.svg|docs/architecture/icons-list\.md|bin/icons/generate-list\.py)$'
        pass_filenames: false
      - id: icons-derived-check
        name: Verify derived icon generation
        entry: python3 bin/icons/generate-derived.py --check
        language: system
        files: '^(resources/icons/fluent/assets/Checkmark/SVG/ic_fluent_checkmark_32_regular\.svg|resources/icons/ui/double-checkmark\.svg|bin/icons/generate-derived\.py)$'
        pass_filenames: false
      - id: emoji-check
        name: Validate emoji pipeline lock and overrides
        entry: python3 bin/emoji/pipeline.py check --repo-root .
        language: system
        files: '^(bin/emoji/.*|resources/emoji/overrides/.*|resources/extra_emoji\.txt|resources/shortcodes\.txt)$'
        pass_filenames: false
      - id: check-markdown-links
        name: Check Markdown links
        entry: python3 bin/docs/check-links.py
        language: system
        files: '(^|/).+\.md$|^bin/docs/check-links\.py$'
        pass_filenames: false
      - id: license-check
        name: REUSE license compliance check
        entry: ./bin/license/check.sh
        language: system
        pass_filenames: false
      - id: completions-check
        name: Verify generated shell completion files are up to date
        entry: ./bin/prek/completions-check.sh
        language: system
        files: '^(src/cli/.*|resources/completions/.*)$'
        pass_filenames: false
      - id: version-drift
        name: Verify version-bearing files agree with VERSION.txt
        entry: ./bin/prek/version-drift.sh
        language: system
        files: '^(VERSION\.txt|CHANGELOG\.md|etc/packaging/archlinux/komai/PKGBUILD|resources/komai\.appdata\.xml\.in|bin/prek/version-drift\.sh|bin/release/prepare\.py)$'
        pass_filenames: false
      - id: release-translations-complete
        name: Verify translations have no unfinished entries (release gate)
        entry: python3 bin/prek/release-translations-complete.py
        language: system
        files: '^(VERSION\.txt|bin/prek/release-translations-complete\.py)$'
        pass_filenames: false
      - id: tests
        name: Run C++ test suite
        entry: ./bin/prek/tests.sh
        language: system
        files: '^(src/.*\.(cpp|h)|tests/.*\.(cpp|h)|resources/qml/.*\.qml|CMakeLists\.txt)$'
        pass_filenames: false
