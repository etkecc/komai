# Sample profile secrets.yml (file fallback only)
#
# This file is used only when:
#   config.yml -> secrets.provider: file
#
# In secret_service mode, sensitive values are read from secure backend and
# this file is absent/unused.

secrets:
  # internal session metadata used by settings persistence:
  "__session.access_token": "syt_xxx"
  "__session.user_id": "@alice:example.org"
  "__session.device_id": "ABCDE12345"
  "__session.homeserver": "https://matrix.example.org"
  # access token/secrets namespace used by UserSettings:
  "komai.<profile_hash>.settings.session.secrets": "{...}"
  # local crypto namespace used by cache:
  "komai.<profile_hash>.local_crypto.pickle_secret": "..."
  # matrix namespace used by cache-side matrix secret names:
  "komai.<profile_hash>.matrix.m.megolm_backup.v1": "..."
