name: Prek

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-24.04
    container:
      image: docker.io/ubuntu:25.10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            cmake \
            just \
            pkg-config \
            libevent-dev \
            libspdlog-dev \
            libre2-dev \
            liblmdb++-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libolm-dev \
            libcmark-dev \
            nlohmann-json3-dev \
            libkdsingleapplication-qt6-dev \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-svg-dev \
            qt6-multimedia-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qtkeychain-qt6-dev \
            qt6-base-private-dev \
            qt6-declarative-private-dev

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Run prek on all files
        run: |
          just configure -DUSE_BUNDLED_COEURL=ON
          just prek-run-on-all
