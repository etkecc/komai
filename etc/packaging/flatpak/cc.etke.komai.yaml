id: cc.etke.komai
command: cc.etke.komai
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
# QtWebEngine is not part of the KDE runtime; it is provided by this BaseApp,
# whose /app prefix (libs, QML plugin, QtWebEngineProcess, Chromium resource
# paks) becomes the starting point of our /app. base-version tracks the runtime.
# Required by Element Call (ELEMENT_CALL=ON); harmless when EC is disabled.
base: io.qt.qtwebengine.BaseApp
base-version: '6.10'
finish-args:
  # needed for webcams, see https://github.com/Nheko-Reborn/nheko/issues/517
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=x11
  - --socket=wayland
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.freedesktop.StatusNotifierItem
  # needed for tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
# Spell-check dictionaries. The bundled en_US dictionary always works; on top
# of that, the freedesktop Hunspell language extensions (org.freedesktop.
# Platform.Hunspell.<locale>) mount their .dic/.aff into /app/share/hunspell,
# where Komai's dictionary discovery picks them up automatically. With
# locale-subset enabled, Flatpak auto-installs the ones matching the user's
# configured languages; any others can be added with `flatpak install`.
add-extensions:
  org.freedesktop.Platform.Hunspell:
    directory: share/hunspell
    version: '24.08'
    subdirectories: true
    no-autodownload: true
    autodelete: false
    locale-subset: true
# Strips dev/devel files installed primarily by the bundled gstreamer
# module that end users don't need at runtime. Komai's own install tree
# no longer touches these paths (its CPMAddPackage calls use
# EXCLUDE_FROM_ALL so dep headers, cmake configs, and static archives
# never enter /app in the first place), but the entries below stay
# load-bearing for gstreamer's headers, pkgconfig, cmake configs, and
# tooling -- removing them here would leave gstreamer's dev tree in the
# final bundle.
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - /libexec
  - /lib/cmake
  - /bin/event_rpcgen.py
  - /bin/playout
  - /bin/secret-tool
  - /bin/gst-*
  - /share/gdb
  - /share/gst*
  - /lib/girepository-1.0/
  - /lib/gst-validate-launcher/
  - /lib/gstreamer-1.0/include
  - /lib/gstreamer-1.0/include/
  - /lib/gstreamer-1.0/libgstcoreelements.so
  - /lib/gstreamer-1.0/libgstopengl*
  - /lib/gstreamer-1.0/libgstximagesink.so
  - /lib/gstreamer-1.0/validate/
  - /lib/libgst*
# Strip the QtWebEngine BaseApp's dev tree (headers, cmake, pkgconfig, mkspecs)
# from the final bundle once all modules are built. Provided by the BaseApp.
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  #
  # System dependencies (not managed by CPM — found via find_package/pkg-config)
  # OpenSSL is provided by the KDE Platform runtime.
  #
  # We bundle a newer GStreamer than the runtime ships (for Qt6 video sink
  # support in plugins-good), but only enable -base and -good. The runtime
  # itself provides extra plugins that don't ship in either subproject --
  # notably libgstpipewire.so from PipeWire (used as pipewiresrc for Wayland
  # screen-share via xdg-desktop-portal), which is loaded from
  # /usr/lib/.../gstreamer-1.0/ at runtime under 1.x plugin ABI compat.
  # Pinned to the stable (even-minor) series; renovate.json constrains
  # updates accordingly. Development (odd-minor) snapshots can fail to
  # build (1.29.2 broke at meson configure) and get no bug-fix releases.
  - name: gstreamer
    buildsystem: meson
    sources:
      - disable-lfs: true
        disable-submodules: true
        tag: 1.28.6
        type: git
        url: https://gitlab.freedesktop.org/gstreamer/gstreamer.git
    config-opts:
      - --auto-features=disabled
      # The docs dirs are always processed even with doc disabled, and the
      # plugin-cache generator they share is only defined when core's check
      # feature is on; without it, configure fails in gst-plugins-good with
      # 'Requested variable "plugins_cache_generator" not found'.
      -  -Dgstreamer:check=enabled
      -  -Dgood=enabled
      -  -Dgst-plugins-good:qt6=enabled
      -  -Dgst-plugins-good:qt-egl=enabled
      -  -Dgst-plugins-good:qt-wayland=enabled
      -  -Dgst-plugins-good:qt-x11=enabled
      -  -Dbase=enabled
      -  -Dgst-plugins-base:gl=enabled
      -  -Dgst-plugins-base:gl_platform=glx,egl
      -  -Dgst-plugins-base:gl_winsys=x11,wayland
      -  -Dgst-plugins-base:x11=enabled
      -  -Dgst-plugins-base:xshm=enabled
  # Komai — CPM-managed deps are pre-fetched as .deps/ source trees below.
  # The Flatpak sandbox has no network access, so FETCHCONTENT_SOURCE_DIR_*
  # tells CPM to use these instead of downloading.
  #
  - name: komai
    builddir: true
    # Create the mount point for the org.freedesktop.Platform.Hunspell.*
    # extensions declared in add-extensions; flatpak-builder requires the
    # directory to exist in /app.
    post-install:
      - mkdir -p ${FLATPAK_DEST}/share/hunspell
    build-options:
      # Rust is installed into the source tree (not /app) so flatpak-builder's
      # global strip pass cannot corrupt rustc's libLLVM shared object.
      append-path: /run/build/komai/.rust/bin
      env:
        CARGO_HOME: /run/build/komai/cargo
        LD_LIBRARY_PATH: /run/build/komai/.rust/lib
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DCOMPILE_QML=ON
      # QtWebEngine (for Element Call) is installed into /app by the
      # io.qt.qtwebengine.BaseApp; add /app so find_package can locate its
      # Qt6WebEngineQuick config (the rest of Qt6 lives in the SDK's /usr).
      - -DCMAKE_PREFIX_PATH=/app
      # libQt6WebEngineCore.so pulls libsnappy.so.1 / libminizip.so.1 via
      # DT_NEEDED, but the BaseApp installs those into /app/lib (not the
      # /app/lib/<triplet> dir the linker already searches). Resolving the
      # symbols of an indirectly-needed shared lib uses ld's -rpath-link path
      # (a plain -L does not feed it), and --allow-shlib-undefined keeps the
      # final check happy (the loader resolves these at runtime via /app/lib).
      - -DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath-link,/app/lib -Wl,--allow-shlib-undefined
      # Flatpak doesn't ship a man page: asciidoctor (Ruby) is not in the KDE
      # runtime, and users can't easily `man komai` against a flatpak-installed
      # binary anyway since /var/lib/flatpak/.../share/man isn't in $MANPATH.
      - -DMAN=OFF
      - -DFLATPAK=ON
      # Pre-fetched CPM dependency sources — absolute paths required with builddir: true.
      # /run/build/komai is where flatpak-builder places the komai source tree.
      - -DFETCHCONTENT_SOURCE_DIR_CORROSION=/run/build/komai/.deps/corrosion
      - -DFETCHCONTENT_SOURCE_DIR_QT6KEYCHAIN=/run/build/komai/.deps/qtkeychain
      - -DFETCHCONTENT_SOURCE_DIR_KDSINGLEAPPLICATION=/run/build/komai/.deps/kdsingleapplication
      - -DFETCHCONTENT_SOURCE_DIR_LITEHTML=/run/build/komai/.deps/litehtml
    buildsystem: cmake-ninja
    sources:
      - path: ../../..
        type: dir
        skip:
          - .git
          - var
          - etc/packaging
      # The emoji pipeline fetches Unicode/CLDR inputs into var/emoji/cache on the host.
      # Copy that cache into the sandbox so the build-time generation step stays offline.
      - path: ../../../var/emoji/cache
        dest: var/emoji/cache
        type: dir
      # Element Call: `just element-call-fetch` populates var/element-call/<version> on
      # the host; copy it in so CMake embeds the bundle without hitting the network.
      - path: ../../../var/element-call
        dest: var/element-call
        type: dir
      # Pinned Rust toolchain — the SDK's rust-stable extension ships whatever
      # version is current, which may trigger compiler regressions (e.g. the
      # query-depth overflow in matrix-sdk on Rust >=1.94).  Bundle the exact
      # version we test against instead.  Installed into the source tree (not
      # /app) so flatpak-builder's strip pass cannot corrupt the LLVM library.
      - type: archive
        only-arches: [x86_64]
        url: https://static.rust-lang.org/dist/2026-04-16/rust-1.95.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: 2e0338f18ecbaa4a0f631b9e80e8b8e26bb6fe77dd5454fba8a70cf96c1e84a1
        dest: .rust-installer
      - type: archive
        only-arches: [aarch64]
        url: https://static.rust-lang.org/dist/2026-04-16/rust-1.95.0-aarch64-unknown-linux-gnu.tar.xz
        sha256: 094c9c36531911c5cc7dd6ab2d3069ab8dcd744d6239b0bda1387b243dfc391e
        dest: .rust-installer
      # Rust crate sources for offline builds (generated by just flatpak-cargo-sources)
      - ../../../var/build/flatpak/cargo-sources.json
      # Pre-fetched CPM dependency sources (no network in sandbox)
      - dest: .deps/corrosion
        disable-lfs: true
        tag: v0.6.1
        type: git
        url: https://github.com/corrosion-rs/corrosion.git
      - type: shell
        commands:
          # Install the pinned Rust toolchain into the source tree.
          - .rust-installer/install.sh --prefix=$PWD/.rust --disable-ldconfig
          - rm -rf .rust-installer
          # Corrosion's `cargo install cxxbridge-cmd --locked` uses the crate's
          # published lockfile, whose pinned versions may differ from our vendor.
          # Drop --locked so cargo resolves from the vendored sources directly.
          - sed -i '/^[[:space:]]*--locked[[:space:]]*$/d' .deps/corrosion/cmake/Corrosion.cmake
      - dest: .deps/qtkeychain
        disable-lfs: true
        tag: 0.17.0
        type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
      - dest: .deps/kdsingleapplication
        disable-lfs: true
        tag: v1.2.1
        type: git
        url: https://github.com/KDAB/KDSingleApplication.git
      - dest: .deps/litehtml
        disable-lfs: true
        tag: v0.10
        type: git
        url: https://github.com/litehtml/litehtml.git
